name: ON QOL vNext verification
on:
  push:
    paths: ["onqol-vnext/**", ".github/workflows/onqol-vnext-ci.yml"]
  pull_request:
    paths: ["onqol-vnext/**", ".github/workflows/onqol-vnext-ci.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onqol-vnext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: onqol-vnext/package-lock.json
      - run: npm ci
      - run: npm run verify
      # verify must not rewrite committed evidence; a dirty tree means a
      # generator wrote run-dependent output.
      - run: git diff --exit-code
      - run: npm run build:pilot
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:hybrid
      - run: npm run test:e2e:semantic
      - run: npm run test:e2e:mentor
      - run: npm run test:e2e:flexible
