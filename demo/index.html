<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ON QOL — тренажёр клинических кейсов</title>
<style>
:root{--green:#265045;--green-l:#3d6f61;--mint:#eaf2ef;--mint-2:#f4f8f7;
 --line:#d5e3de;--ink:#16211e;--mute:#5f7770;--red:#8f2f2f;--red-bg:#fbf1f1;
 --warn-bg:#fdf6e9;--warn-line:#ecdcbe}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Arial,sans-serif;
 color:var(--ink);background:var(--mint-2);font-size:16px;line-height:1.5}
.wrap{max-width:540px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
 background:var(--mint-2);box-shadow:0 0 40px rgba(38,80,69,.07)}
header{display:flex;align-items:center;gap:13px;padding:13px 18px;background:#fff;
 border-bottom:1px solid var(--line);flex:0 0 auto}
.logo{font-weight:800;letter-spacing:.13em;color:var(--green);font-size:14px}
.sep{width:1px;height:26px;background:var(--line)}
.tag{font-size:12.5px;color:var(--mute);flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{border:0;background:#fff;color:var(--mute);font:700 11.5px/1 inherit;
 padding:7px 9px;cursor:pointer;letter-spacing:.05em}
.lang button.on{background:var(--green);color:#fff}
.keyb{border:1px solid var(--line);background:#fff;color:var(--mute);border-radius:7px;
 padding:6px 9px;font-size:14px;cursor:pointer;line-height:1}
.keyb.on{background:var(--green);color:#fff;border-color:var(--green)}
.typing{color:var(--mute);font-size:14px;font-style:italic}
main{flex:1 1 auto;overflow-y:auto;padding:18px}
footer{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:10px 14px 14px}
.hint{font-size:11.5px;color:var(--mute);text-align:center;margin-bottom:8px}
.row{display:flex;gap:8px}
textarea{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 13px;
 font:inherit;font-size:15.5px;resize:none;height:46px;max-height:110px;outline:0}
textarea:focus{border-color:var(--green-l)}
.send{width:46px;flex:0 0 46px;border:0;border-radius:11px;background:var(--green);
 color:#fff;font-size:19px;cursor:pointer}
.send:disabled{background:#c4d6d1}
.msg{margin-bottom:13px;display:flex}
.msg.me{justify-content:flex-end}
.bub{max-width:88%;padding:12px 15px;border-radius:15px;background:#fff;
 border:1px solid var(--line);font-size:15.5px}
.me .bub{background:var(--green);color:#fff;border-color:var(--green);max-width:82%}
.bub b{color:var(--green);font-weight:700}
.me .bub b{color:#fff}
.bub ul{margin:7px 0 0;padding-left:19px}
.bub li{margin-bottom:4px}
.bub hr{border:0;border-top:1px solid var(--line);margin:11px 0}
.ask{color:var(--green);font-weight:700;margin-top:10px;display:block}
.src{font-size:12px;color:var(--mute);border-left:2.5px solid var(--line);
 padding:2px 0 2px 10px;margin:9px 0 0}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;
 padding:3px 6px;border-radius:4px;margin-right:5px;vertical-align:1px}
.p-str{background:var(--green);color:#fff}
.p-con{background:#dae7e3;color:var(--green)}
.p-kp{background:#f4dede;color:var(--red)}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;
 padding:10px 12px;margin-top:10px;font-size:14px;color:#5b3f14}
.errbox{background:var(--red-bg);border:1px solid #ebd0d0;border-radius:10px;
 padding:10px 12px;margin-top:10px;font-size:14px;color:#5f2020}
.okbox{background:var(--mint);border:1px solid #bfd8d1;border-radius:10px;
 padding:10px 12px;margin-top:10px;font-size:14px}
.scene{background:var(--mint);border:1px solid var(--line);border-radius:14px;
 padding:14px 15px;margin-bottom:14px}
.scene .m{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
 color:var(--green-l);font-weight:800;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;
 padding:4px 10px;color:var(--green)}
.chip.no{color:#9aada8;text-decoration:line-through}
h1{font-size:23px;color:var(--green);margin:0 0 7px;line-height:1.22}
.sub{color:var(--mute);font-size:14.5px;margin:0 0 20px}
.mode{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
 border-radius:14px;padding:16px 17px;margin-bottom:11px;cursor:pointer;font:inherit}
.mode:hover{border-color:var(--green-l)}
.mode b{display:block;color:var(--green);font-size:16.5px;margin-bottom:4px}
.mode span{color:var(--mute);font-size:13.5px}
.lockrow{display:flex;justify-content:space-between;border:1px dashed var(--line);
 border-radius:10px;padding:11px 12px;margin-bottom:6px;font-size:14px;color:var(--mute)}
.h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
 font-weight:800;margin:24px 0 9px}
.foot{font-size:11.5px;color:var(--mute);margin-top:22px;padding-top:14px;
 border-top:1px solid var(--line);line-height:1.5}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">ON QOL</div><div class="sep"></div>
  <div class="tag" id="tag"></div>
  <button id="keyb" class="keyb" onclick="askKey()">⚿</button>
  <div class="lang"><button id="bru" class="on" onclick="setL('ru')">РУС</button>
  <button id="bkk" onclick="setL('kk')">ҚАЗ</button></div>
</header>
<main id="main"></main>
<footer id="foot" class="hide">
  <div class="hint" id="hint"></div>
  <div class="row">
    <textarea id="inp" rows="1"></textarea>
    <button class="send" id="snd" onclick="send()">→</button>
  </div>
</footer>
</div>

["Гематологический анализатор сломан","Врач УЗИ приходит к 9:00","Санитарный транспорт на выезде — 3 часа"],

# ОБСТОЯТЕЛЬСТВА СМЕНЫ

Передаются отдельным списком (врач УЗИ приходит к 9:00; анализатор сломан;

Обстоятельство не отменяет стандарт — оно меняет путь к нему. Оно не может
сделать правильное решение невозможным и не может вести к обходу закона или
этики. В разборе обстоятельство обязано быть названо вместе с его ценой.

# РАСПРЕДЕЛЕНИЕ РОЛЕЙ — САМОЕ ВАЖНОЕ

ТЫ — источник всех данных о пациенте. Врач их не видит: пациента перед ним нет,
есть только то, что сообщил ты.

Врач говорит, ЧТО он делает. Ты сообщаешь, ЧТО ОН ПРИ ЭТОМ НАХОДИТ.

НИКОГДА не проси врача описать находки, симптомы, результаты осмотра или
анализов. Он не может их знать. Формулировки «расскажи мне, что ты видишь»,
«какие симптомы нашёл?», «что при пальпации?» — грубая ошибка роли.

Правильно:
  Врач: «физикальный осмотр»
  Ты:   «Живот не вздут, участвует в дыхании. Локальная болезненность и
         защитное напряжение в правой подвздошной. Щёткина–Блюмберга локально
         положительный… Что дальше?»

Неправильно:
  Ты: «Расскажи, что ты нашёл при пальпации? Есть дефанс?»

Вопросы ты задаёшь только о РЕШЕНИЯХ врача: «Твой диагноз?», «Тактика?»,
«Оперируешь или наблюдаешь?». Никогда — о данных.

# ВЕДЕНИЕ ДИАЛОГА

Врач отвечает свободным текстом и часто перечисляет несколько действий сразу.
Обрабатывай ВСЕ названные действия в одном ответе, в логическом порядке,
а не первое из них.

«Физикальный осмотр» и «опрос» — это два действия: выдай и осмотр, и уточнённый
анамнез.

Выдавай только запрошенное. Не перечисляй, что ещё можно было бы сделать,
и не давай списков возможных исследований. Не подсказывай следующий шаг, пока
врач не зашёл в тупик или не совершил опасную ошибку.

Заканчивай каждый ответ ОДНИМ коротким вопросом: «Что дальше?», «Твой диагноз?»,
«Тактика?». Не задавай список вопросов.

# ТЕХНИКА КОРРЕКЦИИ

Три режима, не смешивать.

1. НЕОПТИМАЛЬНО, НО НЕ ОПАСНО — короткое замечание в одну-две строки по ходу,

   сохранность печёночной тупости — это против перфорации. Обрати внимание на

2. ОШИБКА БЕЗ НЕМЕДЛЕННОГО ВРЕДА — дай ей развернуться на один ход. Верни

3. КРАСНАЯ ЛИНИЯ — останови немедленно, но НЕ читай нотацию. Останови одним

   найти ошибку самому. Объясняй, только если он не находит со второй попытки.
   Сократический ход учит лучше, чем правильный ответ, выданный сразу.

# ДИНАМИКА КЕЙСА

Кейс не статичен: время идёт от решений врача, состояние меняется.

Разрешённые переходы заданы в блоке ТЕКУЩИЙ КЕЙС. Новых поворотов не изобретать.
Если врач делает то, для чего перехода не описано, — состояние не меняется,
время идёт, и ты сообщаешь о прошедшем времени.

Действие должно иметь последствие. Назначил инфузию — покажи, что изменилось
в гемодинамике. Выбрал наблюдение — через положенный срок дай новый осмотр
и новый анализ.

# ИСТОЧНИКИ

Никогда не приводи ссылку, которой нет в корпусе. Не изобретай названий
руководств, годов издания, номеров рекомендаций и разделов. Для этой нозологии
в корпусе ровно два источника: WSES Jerusalem 2025 (JAMA Surg 2026;161(3):283–295)
и КП МЗ РК 2018 (протокол №61). Больше ничего называть нельзя.

Если врач спрашивает, что почитать по смежной теме, которой в корпусе нет —
скажи, что в этой версии её нет, и не называй источников по памяти.

# ОЦЕНКА УРОВНЯ

Оценивай только по пяти критериям, называя их прямо:
1. Назначено ли доступное — и понял ли врач пределы назначенного.
2. Различены ли «уверен» и «нельзя исключить».
3. Соответствует ли тактика источнику — и знает ли врач, где источник расходится
   с протоколом.
4. Верен ли маршрут.
5. Закрыт ли кейс — организовано ли то, что должно случиться после выписки.

Не выдавай общих характеристик вроде «уровень средний с хорошим потенциалом».
Это не измерение, а впечатление.

# ФОРМАТ ОТВЕТА

Коротко: не более 120 слов на реплику, кроме финального разбора.

Заголовок — **жирным**. Данные — списком через «- ». Нумерованные списки только
там, где важен порядок.

ЗАПРЕЩЕНО: заголовки через решётку (#, ##), таблицы, эмодзи, горизонтальные
линии. Только жирный текст и маркированные списки.

Не пиши вводных фраз вроде «Хорошо, давай посмотрим» — начинай сразу с данных.

При каждой рекомендации — метка силы:
  [СИЛЬНАЯ · умеренная]   — strong, с уверенностью доказательств
  [УСЛОВНАЯ · низкая]     — conditional (weak)
и номер рекомендации.

При расхождении с КП МЗ РК — отдельный блок с пометкой КП≠ и объяснением, какая
позиция защищает врача юридически, а какая опирается на текущие данные.

# ЗАВЕРШЕНИЕ

По команде «конец кейса» / «кейс соңы» — разбор в следующем порядке.

A. ЧТО СДЕЛАНО ПРАВИЛЬНО — по пунктам, конкретно, без общих похвал.

B. ЧТО ПРОПУЩЕНО ИЛИ НЕОПТИМАЛЬНО — по пунктам, с механизмом: не «надо было
   иначе», а почему именно это вредит.

C. ТРИ ЧАСТИ ПРО РЕСУРС — обязательны все три:
   1. Что было бы сделано при полном ресурсе — со ссылкой и силой рекомендации.
   2. Что было разумно здесь и почему.
   3. Что именно потерял пациент из-за ограничения — прямо, без смягчения.
   Третья часть обязательна. Без неё продукт учит, что пониженный стандарт —
   норма.

D. КЛЮЧЕВОЙ ОБУЧАЮЩИЙ МОМЕНТ — одна мысль, которую врач должен унести. Не список.

E. ОЦЕНКА по пяти критериям из раздела ОЦЕНКА УРОВНЯ.

Раздел «что почитать» давай только из корпусных источников. Если добавить нечего —
не добавляй.

# КРАСНЫЕ ЛИНИИ — останавливай немедленно

1. НОМ (антибиотики вместо операции) при осложнённом аппендиците.
2. Ранняя аппендэктомия при периаппендикулярном абсцессе у пациента ≥35 лет.
3. Завершение кейса «абсцесс + НОМ + возраст ≥35» без интервальной
   аппендэктомии через 6–12 недель.
4. Послеоперационные антибиотики дольше 3 дней при осложнённом с адекватным
   контролем источника; любой курс при неосложнённом у взрослых.
5. Рутинный дренаж при осложнённом; рутинный лаваж не обязателен.
6. Перевод пациента с абдоминальным сепсисом ДО контроля источника.
7. Отсрочка операции сверх 24 часов при неосложнённом, отобранном на операцию.

# КОРПУС — острый аппендицит (app-acute)

Источник: Podda M, et al. 2025 Edition of the WSES Jerusalem Guidelines.
JAMA Surg. 2026;161(3):283–295. doi:10.1001/jamasurg.2025.6218
КП: «Острый аппендицит», КП МЗ РК 2018, ОКК 04.03.2019, протокол №61
(опирается на WSES 2016).

## Диагностика
— Шкалы AIR, AAS, PAS для маршрутизации: исключить низкий риск, выделить
  промежуточный (нужна визуализация ИЛИ активное наблюдение).
  [УСЛОВНАЯ · умеренная] Рек. 1. Числовых порогов руководство не даёт.
— Рек. 3.1 [УСЛОВНАЯ · умеренная]: шкалы + УЗИ — признанная альтернатива
  низкодозной КТ там, где КТ недоступна. Где доступна — низкодозная КТ
  предпочтительна у взрослых там, где доступна.
— Дети: УЗИ первой линией, КТ при неинформативности. Рек. 3.2 [УСЛОВНАЯ · умеренная]
— Ожирение (ИМТ ≥30) и пожилые: КТ, а не УЗИ первично. Рек. 3.3, 3.4
  [УСЛОВНАЯ · низкая / очень низкая]
— Беременные: МРТ при отрицательном или неопределённом УЗИ. Рек. 4
  [УСЛОВНАЯ · умеренная]. Не задерживать лечение только ради МРТ.
— Валидность шкал у беременных, пожилых, иммунокомпрометированных
  не установлена — так заявляет само руководство.

## Тактика, неосложнённый
— Взрослые: антибиотики — альтернатива аппендэктомии при мониторинге и
  совместном решении. Рек. 5.1 [УСЛОВНАЯ · умеренная]. Риск рецидива 15–20% —
  называть обязательно.
— Дети: то же. Рек. 5.2 [УСЛОВНАЯ · умеренная]
— Беременные: лапароскопическая аппендэктомия ПРЕДПОЧТИТЕЛЬНА. Рек. 5.3
  [УСЛОВНАЯ · очень низкая]
— Пожилые: аппендэктомия предпочтительна. Рек. 5.4 [УСЛОВНАЯ · очень низкая]
— Амбулаторный НОМ возможен при follow-up. Рек. 6 [УСЛОВНАЯ · умеренная]
— Против рутинного наблюдения дольше 30 дней после НОМ. Рек. 7.1, 7.2
— Против рутинной интервальной аппендэктомии после НОМ неосложнённого. Рек. 8

## Сроки
— Лапароскопическая аппендэктомия в пределах 24 часов от поступления.
  Рек. 9.1, 9.2 [СИЛЬНАЯ · умеренная]. 24 часа — потолок, не ориентир.

## Техника
— Осложнённый: эвакуировать контаминированную жидкость. WSES предпочитает аспирацию без рутинного лаважа; SAGES допускает и аспирацию, и аспирацию с лаважем. Лаваж не ошибка. Рек. 10.1 [УСЛОВНАЯ · умеренная]
— Предлагается избегать рутинного дренажа. Не запрет по показанию. Рек. 11.1 [УСЛОВНАЯ · низкая]
— Макроскопически неизменённый отросток при диагностической лапароскопии
  удалять, если нет другой находки. Рек. 12 [УСЛОВНАЯ · очень низкая]

## Периаппендикулярный абсцесс — порог 35 лет
— <35: ранняя лапароскопическая аппендэктомия. При нехватке лапароскопической
  экспертизы или ресурсов — НОМ + интервальная аппендэктомия через 6–12 недель.
  Рек. 13.1 [УСЛОВНАЯ · умеренная]
— ≥35: ПРОТИВ ранней аппендэктомии — риск опухоли отростка до 14,3%.
— ≥35 после НОМ: интервальная аппендэктомия через 6–12 недель ОБЯЗАТЕЛЬНА.
  Рек. 14.1 [СИЛЬНАЯ · умеренная]
— Дети: ранняя лапароскопия; против рутинной интервальной. Рек. 13.2, 14.2

## Антибиотики
— Неосложнённый, до операции: ОДНОКРАТНАЯ доза профилактики. Против
  антибиотиков сверх неё в ожидании операции. Рек. 15.1 [СИЛЬНАЯ · умеренная]
— Осложнённый, до операции: профилактика [СИЛЬНАЯ · высокая] + терапевтические
  антибиотики, когда немедленная операция невыполнима. Рек. 16.1
— Неосложнённый, после операции: ПРОТИВ антибиотиков. Рек. 17.1 [УСЛОВНАЯ · низкая]
— Дети, неосложнённый, после операции: рекомендация НЕ сформулирована —
  уверенность очень низкая. Рек. 17.2. Это допустимый ответ «доказательств нет».
— Осложнённый, после операции: назначать. Рек. 18.1 [СИЛЬНАЯ · умеренная]
— Длительность при осложнённом: 2–3 дня вместо 5–7 после адекватного контроля
  источника. Рек. 19.1 [УСЛОВНАЯ · умеренная]
— Молекулы руководство не называет. Из КП МЗ РК: цефуроксим, цефтазидим,
  цефтриаксон, цефоперазон, метронидазол, амикацин.

## Расхождения с КП МЗ РК 2018 — называть вслух
1. Шкала: КП использует Альварадо; руководство 2025 — AIR, AAS, PAS.
2. КП рекомендует эмпирическую антибиотикотерапию на 12/24 ч наблюдения;
   Рек. 15.1 [СИЛЬНАЯ] против антибиотиков сверх однократной профилактики.
   ПРЯМОЕ ПРОТИВОРЕЧИЕ.
3. КП не предусматривает НОМ как опцию; антибиотики только при отказе
   пациента от операции.
4. КП: «лапароскопию не следует рассматривать как первый выбор у беременных»;
   Рек. 5.3 — лапароскопия предпочтительна. ПРЯМОЕ ПРОТИВОРЕЧИЕ.
5. КП: послеоперационный курс 3–5 дней; Рек. 19.1 — 2–3 дня.
6. КП: возрастного порога 35 лет нет; интервал 6–8 недель вместо 6–12.
7. КП разрешает оперировать при невозможности исключить диагноз в отсутствие
   эндовидеохирургического комплекса — это ресурсная ветвь, ей можно следовать.

## Дифференциальный ряд (боль в правой подвздошной области)
Из таблицы КП: перфоративная язва (пневмоперитонеум на обзорной R-графии,
язвенный анамнез, доскообразный живот); почечная колика (приступообразная боль,
дизурия, гематурия, НЕТ дефанса); пиелонефрит (температура через 1–2 дня ПОСЛЕ
боли, пиурия); холецистит (связь с жирной пищей, пальпируемый жёлчный пузырь);
гастроэнтерит (многократный жидкий стул, НЕТ локальной болезненности и дефанса);
ВЗОМТ (выделения, болезненные придатки бимануально).
Вне КП: ВНЕМАТОЧНАЯ БЕРЕМЕННОСТЬ — тест на беременность обязателен у любой
женщины детородного возраста, всегда.

## Пороги перевода (операционализация, не из руководства)
basic:
— Неосложнённый, диагноз ясен → оперировать здесь.
— Диагноз неясен, перитонеальных знаков нет → оперировать здесь, не переводить.
— Осложнённый + органная дисфункция с потребностью в продлённой ИВЛ →
  контроль источника здесь, ЗАТЕМ перевод. Не наоборот.
— Абсцесс до операции → вскрытие и дренирование, по возможности внебрюшинно.
— Абсцесс + возраст ≥35 → дренирование здесь + ОБЯЗАТЕЛЬНЫЙ маршрут на
  интервальную аппендэктомию.
— Плотный неразделимый инфильтрат → консервативно.
— Беременная II–III триместр, стабильна → перевод, если плечо позволяет.
— Беременная с перитонитом → оперировать здесь.
Порог зависит от времени до принимающего стационара. Числа нет ни в одном
источнике — спроси у врача его реальное плечо эвакуации и рассуждай от него.

Ловушка кейса: стёртая картина у пожилого. КП описывает первично-гангренозный аппендицит на фоне атеросклероза или тромбоза аппендикулярной артерии: начинается резкой локальной болью, которая затем стихает; локальный мышечный дефанс нечёткий из-за возрастной релаксации мышц, однако симптом Щёткина–Блюмберга выражен. Температура при гангренозном может быть нормальной или ниже 36 °C и не соответствует уровню тахикардии — «токсические ножницы». Врач, ждущий типичной картины, потеряет время.
Данные по запросу:
- Осмотр: вялый, кожа сухая. Живот умеренно вздут, участвует в дыхании ограниченно. Болезненность в правой подвздошной без чёткого дефанса. Щёткина–Блюмберга положительный справа внизу. Перистальтика ослаблена. Печёночная тупость сохранена. Per rectum: болезненность справа.
- ОАК: лейкоциты 17,8 ×10⁹/л, выраженный сдвиг влево, гемоглобин 134 г/л.
- ОАМ: без патологии.
- Обзорная R-графия: свободного газа нет.
- Анамнез при уточнении: боль была очень сильной первые часы, потом «отпустило»; мочеиспускание обычное; стул был утром.
- УЗИ (если доступно): визуализация затруднена газом; в правой подвздошной ямке свободная жидкость, отросток чётко не лоцируется.
- КТ (если доступна): отросток 13 мм, стенка неоднородная, периаппендикулярная жидкость, признаков отграниченного абсцесса нет.
Разрешённые переходы:
1. Операция в ближайшие часы → гангренозный отросток, мутный выпот в правой подвздошной ямке, местный перитонит без распространения. Дальше правила ОСЛОЖНЁННОГО: эвакуация контаминированной жидкости (рутинный лаваж не обязателен), без рутинного дренажа, послеоперационный курс 2–3 дня.
2. Наблюдение более 6 часов → перфорация, распространённый перитонит, ЧСС 120, АД 95/60, олигурия. Требуется предоперационная подготовка.
3. Перевод до операции при уже развившемся перитоните → красная линия: перевод при абдоминальном сепсисе до контроля источника.`},

{id:"app-03",lvlmin:"basic",
 ru:"<b>Пациентка:</b> женщина, 38 лет.<br><b>Жалоба:</b> боль внизу живота справа, шестые сутки. Первые дни было хуже, сейчас терпимо.<br><b>Анамнез:</b> к врачу не обращалась, принимала обезболивающее. Температура держится около 37,5 °C.<br><b>Витальные:</b> АД 120/75, ЧСС 88, ЧД 17, температура 37,6 °C.",
 kk:"<b>Науқас:</b> әйел, 38 жаста.<br><b>Шағымы:</b> іштің оң жақ төменгі бөлігіндегі ауырсыну, алтыншы тәулік.<br><b>Анамнез:</b> дәрігерге қаралмаған, ауырсынуды басатын дәрі ішкен. Дене қызуы 37,5 °C шамасында.<br><b>Көрсеткіштер:</b> АҚ 120/75, ЖСЖ 88, ТЖЖ 17, дене қызуы 37,6 °C.",
 p:`Истинный диагноз: периаппендикулярный абсцесс. Женщина 38 лет — ВОЗРАСТ ≥35, это ключ кейса.
Ловушка кейса: рефлекс «взять на аппендэктомию». Рек. 13.1 — у пациентов 35 лет и старше ПРОТИВ ранней аппендэктомии из-за риска опухоли отростка до 14,3%. Правильно: дренирование (чрескожное там, где есть; вскрытие и дренирование внебрюшинным доступом там, где нет — прямо разрешено КП) и ОБЯЗАТЕЛЬНЫЙ маршрут на интервальную аппендэктомию через 6–12 недель, Рек. 14.1 [СИЛЬНАЯ]. Кейс НЕ засчитывается закрытым, если врач выписывает пациентку без организованного направления.
Данные по запросу:
- Осмотр: состояние удовлетворительное. Живот мягкий вне зоны; в правой подвздошной пальпируется плотноватое болезненное образование около 7 см с нечёткими границами. Перитонеальных знаков вне зоны нет. Перистальтика выслушивается. Per rectum: болезненность справа, нависания нет.
- ОАК: лейкоциты 14,1 ×10⁹/л, сдвиг влево, СОЭ ускорена.
- ОАМ: без патологии.
- Тест на беременность: отрицательный.
- Обзорная R-графия: свободного газа нет.
- Гинекологический осмотр: придатки отдельно не дифференцируются из-за инфильтрата, выделений нет.
- УЗИ (если доступно): округлое полостное образование 6×5 см с гипоэхогенным содержимым и пиогенной капсулой.
- КТ (если доступна): отграниченное скопление 6×5 см с плотной стенкой, отросток в структуре инфильтрата.
Разрешённые переходы:
1. Дренирование (любым доступным способом) → температура нормализуется за 2–3 суток, образование уменьшается.
2. Ранняя аппендэктомия → технически трудная операция в инфильтрате, повышенный риск повреждения и несостоятельности культи. Красная линия при возрасте ≥35.
3. Только антибиотики без дренирования → на 3-и сутки лихорадка сохраняется, образование прежнее, требуется дренирование.
4. Выписка без плана на интервальную аппендэктомию → кейс считается незакрытым.`},

{id:"app-04",lvlmin:"basic",
 ru:"<b>Пациентка:</b> женщина, 26 лет.<br><b>Жалоба:</b> боль в правой половине живота, началась внезапно 4 часа назад, схваткообразная, очень интенсивная.<br><b>Анамнез:</b> ранее подобного не было. Рвота дважды.<br><b>Витальные:</b> АД 125/80, ЧСС 92, ЧД 18, температура 36,9 °C.",
 kk:"<b>Науқас:</b> әйел, 26 жаста.<br><b>Шағымы:</b> іштің оң жағындағы ауырсыну, 4 сағат бұрын кенет басталған, ұстамалы, өте қатты.<br><b>Анамнез:</b> бұрын мұндай болмаған. Екі рет құсқан.<br><b>Көрсеткіштер:</b> АҚ 125/80, ЖСЖ 92, ТЖЖ 18, дене қызуы 36,9 °C.",
 p:`Истинный диагноз: правосторонняя почечная колика. АППЕНДИЦИТА НЕТ.
Этот кейс обязателен в наборе: без исхода «аппендицит маловероятен» тренажёр учил бы, что боль справа внизу — всегда аппендицит, и повышал бы частоту негативных аппендэктомий.
Критерии исключения из дифференциальной таблицы КП: боль острая, приступообразная; дизурические явления; ОТСУТСТВИЕ мышечного дефанса и гиперестезии в правой подвздошной; в ОАМ макро- или микрогематурия.
Данные по запросу:
- Осмотр: беспокойна, не находит положения (в отличие от аппендицита, где пациент лежит неподвижно). Живот мягкий, болезненный по правому флангу без чёткой локализации в подвздошной. Дефанса НЕТ, Щёткина–Блюмберга отрицательный, Ровзинга отрицательный. Гиперестезии нет. Поколачивание по правой поясничной области болезненно. Перистальтика активная. Per rectum: без особенностей.
- ОАК: лейкоциты 9,8 ×10⁹/л, формула без сдвига.
- ОАМ: эритроциты 40–50 в поле зрения, лейкоциты 3–4, соли оксалаты.
- Тест на беременность: отрицательный.
- Обзорная R-графия: тень, подозрительная на конкремент, в проекции правого мочеточника.
- Гинекологический осмотр: без патологии.
- Анамнез при уточнении: мочеиспускание участилось, болезненно в конце; боль отдаёт в поясницу и паховую область; диеты не нарушала.
- УЗИ (если доступно): расширение чашечно-лоханочной системы правой почки, конкремент в верхней трети мочеточника; отросток не изменён.
Разрешённые переходы:
1. Врач ставит аппендицит и берёт на операцию → это негативная аппендэктомия. В разборе разбирать прямо, без смягчения, с частотой 11% в LoMIC.
2. Врач распознаёт колику → консультация уролога, обезболивание, тактика по мочекаменной болезни. Дальше корпус этой темы не покрывает — так и скажи.
3. Врач не уверен и берёт активное наблюдение → через 3 часа боль стихла после отхождения конкремента, живот спокоен.`},

{id:"app-05",lvlmin:"basic",
 ru:"<b>Пациентка:</b> женщина, 29 лет, беременность 23 недели.<br><b>Жалоба:</b> боль в правой половине живота, около 10 часов, тошнота.<br><b>Анамнез:</b> беременность первая, протекала без осложнений. Наблюдается в поликлинике.<br><b>Витальные:</b> АД 110/70, ЧСС 98, ЧД 19, температура 37,6 °C.",
 kk:"<b>Науқас:</b> әйел, 29 жаста, жүктілік 23 апта.<br><b>Шағымы:</b> іштің оң жағындағы ауырсыну, шамамен 10 сағат, жүрек айну.<br><b>Анамнез:</b> алғашқы жүктілік, асқынусыз өткен.<br><b>Көрсеткіштер:</b> АҚ 110/70, ЖСЖ 98, ТЖЖ 19, дене қызуы 37,6 °C.",
 p:`Истинный диагноз: острый аппендицит у беременной, 23 недели, неосложнённый.
Ключи кейса — два.
Первый: локализация. КП описывает, что во второй половине беременности боль локализуется ВЫШЕ типичной проекции и усиливается в положении на правом боку (симптом Тараненко-Богдановой); локальное мышечное напряжение выражено слабо из-за растяжения передней брюшной стенки и смещения слепой кишки за увеличенную матку.
Второй: расхождение источников. Рек. 5.3 — лапароскопическая аппендэктомия ПРЕДПОЧТИТЕЛЬНА у беременных [УСЛОВНАЯ · очень низкая]. КП МЗ РК прямо противоположно: «лапароскопию не следует рассматривать как первый выбор при аппендэктомии у беременных» (УД 1 КР В). Это ПРЯМОЕ ПРОТИВОРЕЧИЕ, его надо назвать вслух.
На уровне basic лапароскопии нет вовсе — значит вопрос переходит в порог перевода: стабильная беременная во II триместре при отсутствии лапароскопии и акушерской службы → перевод, если плечо эвакуации позволяет. При признаках перфорации или перитонита → оперировать на месте.
Данные по запросу:
- Осмотр: матка соответствует сроку. Болезненность в правой половине живота выше типичной проекции, усиливается в положении на правом боку. Мышечное напряжение слабое. Щёткина–Блюмберга сомнительный. Перистальтика выслушивается.
- ОАК: лейкоциты 14,9 ×10⁹/л (помни: умеренный лейкоцитоз физиологичен при беременности), сдвиг влево есть.
- ОАМ: без патологии, белка нет.
- Обзорная R-графия: НЕ выполняется — беременность.
- Акушерский осмотр: тонус матки не повышен, сердцебиение плода 148, выделений нет.
- УЗИ (если доступно): отросток чётко не визуализируется, свободная жидкость в правой подвздошной ямке в небольшом количестве.
- МРТ (только maximal): признаки острого аппендицита, отросток 10 мм.
Разрешённые переходы:
1. Операция на месте открытым доступом → флегмонозный аппендицит, беременность сохранена.
2. Перевод в областную при стабильном состоянии → поступает через 2 ч 30 мин, оперирована лапароскопически.
3. Ожидание более 8 часов → температура 38,5, тонус матки повышен, угроза преждевременных родов. Промедление у беременной опаснее, чем субоптимальный доступ.
4. Попытка КТ → противопоказана при беременности; при неинформативном УЗИ показана МРТ (Рек. 4), но она не должна задерживать лечение.`}

function seen(){try{return JSON.parse(localStorage.getItem('onqol.seen')||'[]')}catch(e){return MEM}}
let MEM=[];
function markSeen(id){MEM=[...new Set([...seen(),id])];
 try{localStorage.setItem('onqol.seen',JSON.stringify(MEM))}catch(e){}}
function resetSeen(){MEM=[];try{localStorage.removeItem('onqol.seen')}catch(e){}}
function pickCase(){
 let s=seen(); let left=CASES.filter(c=>!s.includes(c.id));
 if(!left.length){resetSeen();left=CASES.slice()}
 return left[Math.floor(Math.random()*left.length)];
}

let L='ru',mode=null,S={},msgs=[],night=0,KEY='',busy=false,CUR=null;

 document.documentElement.lang=l;draw()}

function draw(){
 tag.textContent=d().tag;
 if(mode===null){foot.className='hide';main.innerHTML=home();return}
 foot.className='';hint.textContent=d().hint;inp.placeholder=d().place;
 main.innerHTML=sceneHTML()+msgs.map(m=>
  `<div class="msg ${m.me?'me':''}"><div class="bub">${m.t}</div></div>`).join('');
 main.scrollTop=main.scrollHeight;
}
function home(){
 const n=d().noz;
 let r=`<div class="lockrow" style="border-style:solid;color:var(--ink);cursor:pointer" onclick="start('real')"><b style="color:var(--green)">${n[0]}</b><span style="color:var(--green-l);font-weight:700">${d().ready}</span></div>`;
 for(let i=1;i<n.length;i++)r+=`<div class="lockrow"><span>${n[i]}</span><span>${d().soon}</span></div>`;
 return `<h1>${d().h1}</h1><p class="sub">${d().sub}</p>
 <button class="mode" onclick="start('ref')"><b>${d().m1}</b><span>${d().m1s}</span></button>
 <button class="mode" onclick="start('real')"><b>${d().m2}</b><span>${d().m2s}</span></button>
 <div class="h2">${d().avail}</div>${r}
 <div class="foot">${L==='ru'
 ?'Образовательный симулятор. Не является системой поддержки клинических решений и не заменяет клинический протокол МЗ РК.<br><br>Демонстрационная версия: ответы берутся из корпуса без обращения к модели. В продукте — модель, ограниченная корпусом. Содержание не прошло независимую верификацию.'
 :'Оқу симуляторы. Клиникалық шешімдерді қолдау жүйесі емес және ҚР ДСМ хаттамасын алмастырмайды.<br><br>Демонстрациялық нұсқа: жауаптар модельсіз корпустан алынады. Мазмұн тәуелсіз тексеруден өтпеген.'}</div>`;
}
function start(m){
 mode=m;night=Math.floor(Math.random()*3);
 S={max:m==='ref',broken:false,noTransport:false,noAnswer:false,
    cbc:0,urine:0,preg:0,waited:0,dx:0,op:0,abx:0,move:0,watch:0,senior:0,ended:0};
 if(m==='real'){S.broken=(night===1);S.noTransport=(night===1);S.noAnswer=(night===2)}
 CUR=KEY?pickCase():CASES[0]; markSeen(CUR.id);
 msgs=[{me:0,t:CUR[L]||CUR.ru,sys:1}];draw();setTimeout(()=>inp.focus(),100);
}
function sceneHTML(){

}

function md(s){
 return esc(s)
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\[(СИЛЬНАЯ|КҮШТІ)([^\]]*)\]/g,'<span class="pill p-str">$1</span><span class="src" style="display:inline;border:0;padding:0">$2</span>')
  .replace(/\[(УСЛОВНАЯ|ШАРТТЫ)([^\]]*)\]/g,'<span class="pill p-con">$1</span><span class="src" style="display:inline;border:0;padding:0">$2</span>')
  .replace(/КП≠/g,'<span class="pill p-kp">КП≠</span>')
  .replace(/^#{1,6}\s*/gm,'').replace(/^[-•*] (.+)$/gm,'<li>$1</li>').replace(/^\d+[.)] (.+)$/gm,'<li>$1</li>')
  .replace(/<\/li>\s*<li>/g,'</li><li>')
  .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>')
  .replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>')
  .replace(/<\/ul><br>/g,'</ul>');
}
function plain(m){
 return String(m.raw||m.t).replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|li|ul|div)>/gi,'\n')
  .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
  .replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function callModel(){
 const hist=msgs.filter(m=>!m.sys&&!m.tmp)
  .map(m=>({role:m.me?"user":"assistant",content:plain(m)}))
  .filter(m=>m.content.length);
 // API требует, чтобы диалог начинался с реплики пользователя
 while(hist.length&&hist[0].role==='assistant')hist.shift();
 const body={model:"claude-haiku-4-5-20251001",max_tokens:1400,system:ctxSys(),messages:hist};
 const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
  headers:{"content-type":"application/json","x-api-key":KEY,
   "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
  body:JSON.stringify(body)});
 if(!r.ok){const e=await r.text();throw new Error(r.status+' '+e.slice(0,160))}
 const j=await r.json();
 return (j.content||[]).map(c=>c.text||'').join('');
}
async function send(){
 if(busy)return;
 const t=inp.value.trim(); if(!t)return;
 inp.value='';msgs.push({me:1,t:esc(t),raw:t});
 const end=/конец кейса|кейс соңы/i.test(t);
 if(!KEY){msgs.push({me:0,t:end?debrief():reply(t)});draw();return}
 busy=true;snd.disabled=true;
 msgs.push({me:0,t:'<span class="typing">…</span>',tmp:1});draw();
 try{
  const out=await callModel();
  msgs.pop();msgs.push({me:0,t:md(out),raw:out});
 }catch(e){
  msgs.pop();
  msgs.push({me:0,t:`<div class="errbox">${L==='ru'?'Модель недоступна':'Модель қолжетімсіз'}: ${esc(e.message)}<br><br>${L==='ru'?'Отвечаю в демо-режиме.':'Демо-режимде жауап беремін.'}</div>`+(end?debrief():reply(t))});
 }
 busy=false;snd.disabled=false;draw();
}
function esc(s){return s.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'})[c])}
function reply(t){
 for(const i of I){ if(i.re.test(t)){ if(i.flag)S[i.flag]=(S[i.flag]||0)+1;
   const f=i[L]||i.ru; return f(L==='ru'?(i.id==='abx'?t:S):S) } }
 return d().unknown;
}
function debrief(){
 S.ended=1;
 const ru=L==='ru';
 let h=`<b>${ru?'Разбор':'Талдау'}</b><hr>`;
 h+=`<div class="okbox"><b>${ru?'Истинный диагноз: острый аппендицит, флегмонозный.':'Нақты диагноз: жіті аппендицит, флегмоноздық.'}</b></div>`;
 if(!S.preg)h+=`<div class="errbox">${ru?'<b>Тест на беременность не сделан.</b> У женщины детородного возраста — обязательно всегда. В анамнезе была задержка около 5 недель. Внематочная убивает за часы, и это единственная позиция ряда, где цена пропуска измеряется не сутками.':'<b>Жүктілікке тест жасалмаған.</b> Бала туу жасындағы әйелде — әрқашан міндетті.'}</div>`;
 if(!S.urine)h+=`<div class="warnbox">${ru?'ОАМ не назначен. Самое дешёвое исследование ряда, различает две позиции из восьми.':'ЗЖА тағайындалмаған. Ең арзан зерттеу.'}</div>`;
 if(S.move)h+=`<div class="errbox">${ru?'Рассматривался перевод. При вероятном аппендиците и плече 2,5 часа это потерянное время и риск перфорации в пути.':'Ауыстыру қаралды. Бұл жағдайда — жоғалған уақыт.'}</div>`;
 h+=`<hr><b>${ru?'Что было бы при полном ресурсе':'Ресурс толық болғанда'}</b><br>${ru?'Низкодозная КТ, затем лапароскопическая аппендэктомия в пределах 24 часов от поступления.':'Төмен дозалы КТ, содан кейін 24 сағат ішінде лапароскопиялық аппендэктомия.'}
 <div class="src"><span class="pill p-con">${ru?'УСЛОВНАЯ':'ШАРТТЫ'}</span>${ru?'Рек. 3.1 · умеренная':'3.1 · орташа'} &nbsp;<span class="pill p-str">${ru?'СИЛЬНАЯ':'КҮШТІ'}</span>${ru?'Рек. 9.1 · умеренная':'9.1 · орташа'}<br>WSES Jerusalem 2025 · JAMA Surg 2026;161(3):283–295</div>`;
 h+=`<b>${ru?'Что разумно здесь':'Осында не орынды'}</b><br>${ru?'Шкала риска как основной инструмент, активное наблюдение при сомнении, открытая аппендэктомия, однократная доза антибиотика за 30 минут до разреза.':'Қауіп шкаласы, күмән болса белсенді бақылау, ашық аппендэктомия, бір реттік доза антибиотик.'}
 <div class="src"><span class="pill p-str">${ru?'СИЛЬНАЯ':'КҮШТІ'}</span>${ru?'Рек. 15.1 · умеренная':'15.1 · орташа'}</div>`;
 h+=`<b>${ru?'Что потеряла пациентка из-за ограничения':'Шектеуден науқас нені жоғалтты'}</b><br>${ru?'Открытый доступ вместо лапароскопического: дольше восстановление, выше риск раневой инфекции. Отсутствие визуализации подняло вероятность напрасной операции — в условиях ограниченного ресурса частота негативных аппендэктомий достигает 11%.':'Лапароскопиялық емес, ашық қолжетім: қалпына келу ұзағырақ. Визуализацияның болмауы ақталмаған операция ықтималдығын арттырды — 11%-ға дейін.'}
 <div class="src">Pitesa R, et al. ANZ J Surg 2025 · doi:10.1111/ans.70103</div>`;
 h+=`<hr><span class='ask'>${ru?'Напиши «ещё раз» — та же пациентка в республиканском центре.':'«тағы бір рет» деп жаз — сол науқас республикалық орталықта.'}</span>`;
 return h;
}
