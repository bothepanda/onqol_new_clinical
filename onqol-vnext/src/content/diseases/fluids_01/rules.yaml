      notes: "Mentor timing and question wording only. Asserts no clinical claim: levels 1-3 are questions/cues, level 4 quotes the approved cards named in `explains` verbatim (checked by test). Not promoted by any reviewer."
  - id: fluids.fluid_choice
    once: true
    scope: command
    priority: 4
    mode: CLARIFY
    authority_layer: mentor_behavior
    concepts: [fluid_choice]
    expects: [fluid_choice_rationale]
    trigger:
      - type: commandTypeIs
        commandType: ORDER_INFUSION
      - type: commandParamLacksTag
        param: fluidId
        tag: balanced_crystalloid
    prompt_ru: "Почему выбираешь именно этот раствор?"
    explains: [FLU-CHOICE-001]
    debrief_ru:
      corrected_after_prompt: "Выбор раствора был обсуждён с наставником, обоснование прозвучало."
      corrected_then_independent: "Выбор раствора был обсуждён с наставником, обоснование прозвучало."
      corrected_then_repeated: "Выбор раствора был обсуждён с наставником, обоснование прозвучало."
