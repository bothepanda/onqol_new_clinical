# fluids-01 reviewed clinical rules and mentor behaviour.
#
# `rules`: the two runtime rules the source calls out as CRITICAL FLAGS
# separate from score (Часть C: C1, C2) plus one deliberately pending rule.
# `teaching_issues` / `mentor_policy` (below): when the stateful mentor speaks
# and how it asks - see src/ai/mentor/teachingCandidates.js. The clinical
# statements the mentor may voice live in the approved card library
# (src/content/mentor/fluids01-library.json), each a verbatim-quote extraction
# of the frozen case (docs/evidence/WAVE_B_FLUIDS_CARD_FAITHFULNESS.json).
schema_version: "1.0"

rules:
  # C1: diuretic ordered before any resuscitation bolus given. LEVEL_3, not
  # LEVEL_4 - the order still executes (see trajectories.yaml
  # furosemide_before_volume_correction for the worsening consequence the
  # source itself specifies), because the case models this as a dangerous
  # error with a real consequence and a teachable moment, not a hard stop.
  - id: RULE-FLUIDS-DIURETIC-BEFORE-VOLUME-CORRECTION
    topic: TRAP-OLIGURIA-DIURETIC
    level: LEVEL_3_DANGEROUS
    authority_layer: clinical_rule
    conditions:
      - type: commandTypeIs
        commandType: ORDER_MEDICATION
      - type: commandParamHasTag
        param: drugId
        tag: diuretic
      - type: noResuscitationBolusGiven
        tag: resuscitation_fluid
    teaching_point_ru: >-
      Олигурия у гиповолемичного пациента — не показание к диуретику. Сначала
      оцените и скорректируйте объём, диуретик здесь ухудшит перфузию.
    source_ids: [SRC-ONCALL-SURGERY-CH12, SRC-NICE-CG174]
    provenance:
      id: RULE-FLUIDS-DIURETIC-BEFORE-VOLUME-CORRECTION
      authority_layer: clinical_rule
      jurisdiction: international
      source: "onqol-trainer cases/2026-09-25-fluids-01.md v1.2, Часть C флаг C1"
      source_version_or_date: "1.2 / 2026-09-21"
      evidence_strength: expert_consensus
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-09-21"
      second_review_required: false
      second_reviewed_by: null
      second_reviewed_at: null
      next_review_due: null
      notes: "Source's own #1 typical resident error (Часть A «Типичные ошибки резидентов», item 1)."
    score_weight: 0

  # C2: another bolus after overload signs (RR>=24, matching the derived exam
  # finding) have already been shown to the learner via
  # learnerVisibleVitalGte - never fires on a fact the learner never asked
  # about (the rule engine's own hidden-truth boundary, unchanged).
  - id: RULE-FLUIDS-REPEAT-BOLUS-AFTER-OVERLOAD-SIGNS
    topic: TRAP-BOLUS-WITHOUT-REASSESSMENT
    level: LEVEL_3_DANGEROUS
    authority_layer: clinical_rule
    conditions:
      - type: commandTypeIs
        commandType: ORDER_INFUSION
      - type: commandParamEquals
        param: bolus
        value: true
      - type: learnerVisibleVitalGte
        field: respiratoryRate
        value: 24
    teaching_point_ru: >-
      Уже видны признаки перегрузки (ЧДД растёт). Прежде чем давать ещё
      болюс, переоцените — лёгкие, сатурацию, диурез — и решите, нужен ли
      объём вообще, а не наращивайте его автоматически.
    source_ids: [SRC-NICE-CG174]
    provenance:
      id: RULE-FLUIDS-REPEAT-BOLUS-AFTER-OVERLOAD-SIGNS
      authority_layer: clinical_rule
      jurisdiction: international
      source: "onqol-trainer cases/2026-09-25-fluids-01.md v1.2, Часть C флаг C2"
      source_version_or_date: "1.2 / 2026-09-21"
      evidence_strength: expert_consensus
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-09-21"
      second_review_required: false
      second_reviewed_by: null
      second_reviewed_at: null
      next_review_due: null
      notes: "Source's own #5 typical resident error (Часть A, item 5: «Болюс за болюсом без переоценки, вплоть до отёка лёгких»)."
    score_weight: 0

  # Deliberately PENDING, not approved: proves the governance gate actually
  # withholds content, using the one item the source itself could not verify
  # against the NICE CG174 PDF it checked (disease.yaml provenance notes).
  # This rule must appear only in governanceBlockedEligibleRules, never fire
  # as authority, and never reach a learner - see
  # WAVE_B_FLUIDS_VALIDATION_REPORT.md's governance test.
  - id: RULE-FLUIDS-REPEAT-BOLUS-THRESHOLD
    topic: fluid_repeat_bolus_escalation_threshold
    level: LEVEL_2_EDUCATIONAL
    authority_layer: clinical_rule
    conditions:
      - type: commandTypeIs
        commandType: ORDER_INFUSION
      - type: commandParamEquals
        param: bolus
        value: true
    teaching_point_ru: >-
      [PENDING — не должно достигать резидента] После ~2000 мл болюсами без
      ответа — эскалация и пересмотр диагноза.
    source_ids: [SRC-NICE-CG174]
    provenance:
      id: RULE-FLUIDS-REPEAT-BOLUS-THRESHOLD
      authority_layer: clinical_rule
      jurisdiction: international
      source: "onqol-trainer cases/2026-09-25-fluids-01.md v1.2, Часть A «Тактика»: repeat-bolus / 2000mL threshold"
      source_version_or_date: "1.2 / 2026-09-21"
      evidence_strength: NEEDS_SOURCE
      review_status: pending_review
      reviewed_by: null
      reviewed_at: null
      second_review_required: true
      second_reviewed_by: null
      second_reviewed_at: null
      next_review_due: null
      notes: >-
        The source document itself states this threshold was NOT found in the
        NICE CG174 PDF it checked (attributed to NICE's algorithm 2, not
        included in that PDF). Per governance-gate-strict-approved-only, this
        stays pending_review rather than being silently promoted alongside
        the rest of the case - even though the Clinical Lead promoted the
        rest of v1.2 directly.
    score_weight: 0

# ---------------------------------------------------------------------------
# Mentor behaviour (Wave B): WHEN the mentor speaks and HOW it asks - not what
# is clinically true. Clinical content the mentor may state comes only from
# approved cards (src/content/mentor/fluids01-library.json); level 4 of each
# ladder quotes those cards verbatim. See src/ai/mentor/teachingCandidates.js.
# ---------------------------------------------------------------------------
mentor_policy:
  # The source forbids evaluative wording toward the learner («верно», «хорошо»,
  # «разумно»), so the periodic "reinforce" line is switched off for this case.
  reinforce_every_silent_turns: null
  # "не знаю" with no open issue: neutral, claim-free steps back toward the
  # patient (the shared ladder is a diagnostic-workup script).
  generic_scaffold_ru:
    1: "Что именно сейчас неясно: что происходит с пациентом или что делать дальше?"
    2: "Давай по шагам: что ты уже знаешь о пациенте и чего тебе не хватает, чтобы принять решение?"
    3: "Можно оценить пациента у постели, начать лечение или позвать старшего. Что из этого ты считаешь самым безопасным сейчас и почему?"
    4: "Давай начнём с данных: какие показатели или находки ты хочешь получить первыми?"

teaching_issues:
  - id: fluids.reassessment_plan
    scope: turn
    priority: 3
    mode: CLARIFY
    authority_layer: mentor_behavior
    concepts: [reassessment, monitoring]
    expects: [reassessment_plan]
    trigger:
      - type: turnHasCommand
        commandType: ORDER_INFUSION
      - type: noFollowUpAfterTaggedIntervention
        tag: resuscitation_fluid
        monitoring_targets: [vitals, blood_pressure, heart_rate, urine_output, spo2]
        only_if_never_demonstrated: true
    prompt_ru: "Как ты поймёшь, что болюс подействовал?"
    explains: [FLU-RESUS-001]
    follow_through:
      trigger_event: INFUSION_STARTED
      expected_events: [VITALS_OBSERVED, MONITORING_PRESCRIBED]
    debrief_ru:
      corrected_then_independent: "Болюс был введён без плана переоценки; после вопроса наставника переоценка после следующих вмешательств стала выполняться самостоятельно."
      corrected_after_prompt: "Болюс был введён без плана переоценки; после вопроса наставника переоценка появилась."
      corrected_then_repeated: "После вопроса наставника переоценка появилась, но после следующего вмешательства плана переоценки снова не было."
      open_at_end: "Болюс был введён без плана переоценки; вопрос наставника остался без ответа к концу случая."
      deferred_to_debrief: "План переоценки после болюса остался открытым и вынесен в разбор."
    scaffold_ru:
      1: "Что именно ты будешь смотреть после болюса, чтобы понять, подействовал ли он?"
      2: "Подумай отдельно о том, что ты измеришь, что осмотришь и через какое время посмотришь снова."
      3: "Давай сузим: можно смотреть гемодинамику, перфузию и диурез, лёгкие. Что из этого ты выберешь после болюса и когда?"
      4: "При ресусцитации вводят 500 мл кристаллоида за менее чем 15 минут и сразу переоценивают ЧСС, АД, CRT, диурез и лёгкие. Что из этого ты сделаешь сейчас?"
    provenance:
      id: fluids.reassessment_plan
      authority_layer: mentor_behavior
      jurisdiction: international
      source: "onqol-trainer cases/2026-09-25-fluids-01.md v1.2, Часть B «Вопросы, которые задаёт преподаватель» / Часть D «Режимы преподавателя» (question wording and hint ladder); Wave B authoring"
