  - id: fluids.continue_after_overload
    scope: rule
    rule_id: RULE-FLUIDS-REPEAT-BOLUS-AFTER-OVERLOAD-SIGNS
    priority: 1
    mode: CHALLENGE
    authority_layer: mentor_behavior
    concepts: [fluid_overload, reassessment]
    expects: [plan_change_after_new_findings]
    prompt_ru: "Ты видел, как изменилось дыхание. Как это меняет твой план по жидкости?"
    explains: [FLU-RESUS-003]
    debrief_ru:
      corrected_after_prompt: "После появления признаков перегрузки болюс был продолжен; после вопроса наставника план был пересмотрен. Событие, значимое для безопасности."
      corrected_then_independent: "После появления признаков перегрузки болюс был продолжен; после вопроса наставника план был пересмотрен. Событие, значимое для безопасности."
      corrected_then_repeated: "После появления признаков перегрузки болюс был продолжен; после вопроса наставника план был пересмотрен. Событие, значимое для безопасности."
      open_at_end: "После появления признаков перегрузки болюс был продолжен; к концу случая план не пересмотрен. Событие, значимое для безопасности."
      deferred_to_debrief: "Продолжение болюса при признаках перегрузки вынесено в разбор. Событие, значимое для безопасности."
    scaffold_ru:
      1: "Что изменилось у пациента с прошлой переоценки?"
      2: "Сопоставь дыхание и данные осмотра лёгких с тем, что ты собираешься вводить."
      3: "Варианты: продолжить объём, остановиться и переоценить, или эскалировать. Что ты выбираешь сейчас и почему?"
      4: "Признаки перегрузки — тахипноэ, гипоксия, хрипы, S3, отёки, полные вены шеи; их проверяют при каждой переоценке после болюса, и они — сигнал остановиться. Что ты решаешь теперь?"
