  - id: fluids.diuretic_before_volume
    scope: rule
    rule_id: RULE-FLUIDS-DIURETIC-BEFORE-VOLUME-CORRECTION
    priority: 1
    mode: CHALLENGE
    authority_layer: mentor_behavior
    concepts: [diuretic, oliguria]
    expects: [diuretic_rationale]
    prompt_ru: "Ты назначил диуретик. Что малый диурез говорит тебе о перфузии, прежде чем выбирать лечение?"
    explains: [FLU-OLIGURIA-001]
    debrief_ru:
      corrected_after_prompt: "Диуретик был назначен до оценки и коррекции объёма; после вопроса наставника план был пересмотрен. Событие, значимое для безопасности."
      corrected_then_independent: "Диуретик был назначен до оценки и коррекции объёма; после вопроса наставника план был пересмотрен. Событие, значимое для безопасности."
      corrected_then_repeated: "Диуретик был назначен до оценки и коррекции объёма; после вопроса наставника план был пересмотрен. Событие, значимое для безопасности."
      open_at_end: "Диуретик был назначен до оценки и коррекции объёма; к концу случая план не пересмотрен. Событие, значимое для безопасности."
      deferred_to_debrief: "Назначение диуретика до оценки объёма вынесено в разбор. Событие, значимое для безопасности."
    scaffold_ru:
      1: "Почему именно диуретик при таком диурезе?"
      2: "Подумай отдельно о катетере, перфузии и объёме."
      3: "Варианты: сначала проверить катетер и оценить перфузию, сразу дать диуретик, или сначала взять анализы. Что ты выберешь и почему?"
      4: "Олигурия — не показание сразу давать фуросемид; диуретик, назначенный до оценки или коррекции подозреваемой гиповолемии, — критическая ошибка кейса. Как ты изменишь план?"
