sources:
  - id: SRC-NICE-CG174
    title: "Intravenous fluid therapy in adults in hospital (CG174)"
    organization: "National Institute for Health and Care Excellence"
    publication_year: 2017
    jurisdiction: international
    role: >-
      Checked against the source PDF for §§1.2.1, 1.2.5, 1.3.1, 1.4.1-1.4.4.
      The repeat-bolus and "2000mL -> call senior" thresholds were NOT found
      in this PDF (attributed by the case author to NICE's algorithm 2,
      which the checked PDF does not include) - see RULE-FLUIDS-REPEAT-BOLUS-THRESHOLD.
  - id: SRC-ASCRS-SAGES-ERAS-2023
    title: "ERAS Society consensus guidelines for colorectal surgery (2023 update)"
    organization: "ASCRS/SAGES; Dis Colon Rectum 66:15"
    publication_year: 2023
    jurisdiction: international
    role: "Checked against source PDF for rec. 13 (1A), 14 (1B), 16 (2B), 19 (1B)."
  - id: SRC-SSC-2026
    title: "Surviving Sepsis Campaign 2026"
    organization: "Society of Critical Care Medicine"
    publication_year: 2026
    jurisdiction: international
    role: >-
      Sepsis guideline used only as a directional reference for fluid-type
      and resuscitation-logic in this non-septic postoperative-hypovolemia
      case, not as direct authority for this patient (case author's own
      caveat, preserved here).
  - id: SRC-KDIGO-2012-AKI
    title: "KDIGO Clinical Practice Guideline for Acute Kidney Injury"
    organization: "Kidney Disease: Improving Global Outcomes"
    publication_year: 2012
    jurisdiction: international
    role: "AKI staging criteria only."
  - id: SRC-ONCALL-SURGERY-CH12
    title: "On Call Surgery, ch. 12 (fluids)"
    organization: "Adams G.A."
    role: "Pedagogical starting point only - not treated as clinical authority; several of its claims were explicitly rejected (see rules.yaml REJECTED-TEXTBOOK-CLAIMS)."

teaching_traps:
  - id: TRAP-OLIGURIA-DIURETIC
    concept: oliguria_treated_with_diuretic_instead_of_volume_assessment
    source_ids: [SRC-ONCALL-SURGERY-CH12]
  - id: TRAP-POSITIVE-BALANCE-MEANS-ENOUGH-FLUID
    concept: positive_io_balance_does_not_rule_out_hypovolemia
    source_ids: [SRC-NICE-CG174]
  - id: TRAP-BOLUS-WITHOUT-REASSESSMENT
    concept: repeated_boluses_without_reassessment_risk_overload
    source_ids: [SRC-NICE-CG174]
  - id: TRAP-PREMATURE-AKI-BY-OUTPUT
    concept: aki_by_urine_output_criterion_requires_the_full_6h_window
    source_ids: [SRC-KDIGO-2012-AKI]
  - id: TRAP-BETA-BLOCKER-MASKS-TACHYCARDIA
    concept: beta_blocker_blunts_tachycardic_response_to_hypovolemia
    source_ids: [SRC-ONCALL-SURGERY-CH12]

