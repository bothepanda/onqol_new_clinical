schema_version: "1.0"
disease_id: fluids_01
presentation_category: postoperative_fluid_management
# The resident ends this case themselves ("завершить кейс") once the plan is done; there is no discharge/transfer endpoint.
end_case_status: complete

provenance:
  id: DISEASE-FLUIDS-01
  authority_layer: clinical_rule
  jurisdiction: international
  source: "onqol-trainer cases/2026-09-25-fluids-01.md v1.2 (2026-09-21); Adams G.A. On Call Surgery ch.12 (pedagogical base)"
  source_version_or_date: "1.2 / 2026-09-21"
  evidence_strength: guideline
  review_status: approved_for_training
  reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
  reviewed_at: "2026-09-21"
  second_review_required: false
  second_reviewed_by: null
  second_reviewed_at: null
  next_review_due: null
  notes: >-
    Case frozen by the Clinical Lead before its first live session, with
    per-guideline verification (NICE CG174, ASCRS/SAGES ERAS 2023, SSC 2026,
