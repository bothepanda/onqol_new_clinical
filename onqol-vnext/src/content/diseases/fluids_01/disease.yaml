#
# Governance: the user reviewed and froze the source case herself (v1.2,
# 2026-09-21) with per-guideline verification already recorded inline in the
# source document, and explicitly decided (2026-09-23, Wave B kickoff) to
# promote it directly to approved_for_training on migration rather than
# route it through a second pending_review pass - see memory
# wave-b-fluids-governance-decision. The ONE item the source itself flags as
# an unconfirmed citation (the repeat-bolus / "2000mL -> call senior"
