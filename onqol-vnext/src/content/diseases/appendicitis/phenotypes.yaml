# Phenotype library for acute appendicitis.
#
# Remediated 2026-08-25 against APP004_CLINICAL_REVIEW_MATRIX_v1.0_2026-08-25
# §3 (patient generation and presentation) and the remediation task §5.
#
# NOTHING HERE IS `approved_for_training`. Patient generation is Patient Truth
# under the governance spec (matrix §G1), so every generating object below
# carries its own provenance block and is reported by
# `core/patient/patientTruthGovernance.js` as non-approved development
# content on every session.
schema_version: "1.0"

# ---------------------------------------------------------------------------
# Demographics (matrix P01, P02) - moved OUT of core code.
# ---------------------------------------------------------------------------
# `core/patient/patientGenerator.js` previously hardcoded `int(18, 75)`, which
# is exactly the kind of ungoverned patient-truth generation §G1 forbids. The
# range now lives in content, is gated, and is auditable.
demographics:
  age_years: [18, 58] # matrix P01: elderly presentation is a LATER phenotype, not this one
  sexes: [male, female] # matrix P02
  provenance:
    id: DEMOGRAPHICS-APP-BASE-ADULT
    authority_layer: patient_truth
    jurisdiction: international
    source: "Clinical reviewer decision, APP004_CLINICAL_REVIEW_MATRIX_v1.0_2026-08-25 P01/P02"
    source_version_or_date: "2026-08-25"
    evidence_strength: expert_consensus
    review_status: approved_for_training
    reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
    reviewed_at: "2026-08-31"
    second_review_required: false
    second_reviewed_by: null
    second_reviewed_at: null
    next_review_due: null
    notes: "APP-004 adult 18–58 pilot scope fixed by Clinical Lead decision F1 on 2026-08-31."

# ---------------------------------------------------------------------------
# Nausea / vomiting coherence (matrix P06, task §5.5)
# ---------------------------------------------------------------------------
# Previously vomiting was drawn as an independent counted symptom, which can
# produce repeated vomiting with no nausea. These are COMBINED states, so the
# generator cannot express an incoherent combination at all - the constraint is
# structural, not a probability the reviewer has to trust.
nausea_vomiting_states:
  - id: none
    nausea: false
    vomiting_episodes: 0
    history_ru: "тошноты и рвоты нет"
  - id: nausea_only
    nausea: true
    vomiting_episodes: 0
    history_ru: "беспокоит тошнота, рвоты не было"
  - id: nausea_with_single_vomit
    nausea: true
    vomiting_episodes: 1
    history_ru: "была тошнота, рвота однократно"
  - id: nausea_with_repeat_vomit
    nausea: true
    vomiting_episodes: 2
    history_ru: "была тошнота, рвота дважды"
provenance_nausea_vomiting:
  id: SYMPTOM-NAUSEA-VOMITING-COHERENCE
  authority_layer: patient_truth
  jurisdiction: international
  source: "Clinical reviewer decision, matrix P06"
  source_version_or_date: "2026-08-25"
  evidence_strength: expert_consensus
  review_status: approved_for_training
  reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
  reviewed_at: "2026-08-31"
  second_review_required: false
  second_reviewed_by: null
  second_reviewed_at: null
  next_review_due: null
  notes: "Only the coherence constraint is approved. Selection frequency remains a separate blocked calibration."

nausea_vomiting_selection_calibration:
  # Clinical Lead decision (APP004 Numeric Calibration Review 2026-08-31,
  # NAUSEA/VOMITING): the uniform draw over the four approved coherent states is
  # ACCEPTED as non-epidemiological simulation sampling. It is deliberately not
  # a claimed real-world prevalence estimate; it exists only to vary one clause
  # of the history narrative across seeds.
  method: uniform_simulation_sampling
  is_epidemiological_estimate: false
  provenance:
    id: CAL-NAUSEA-VOMITING-SELECTION-APP004
    authority_layer: patient_truth
    jurisdiction: international
    source: "APP004 Numeric Calibration Review 2026-08-31 (NAUSEA/VOMITING); coherent states approved as SYMPTOM-NAUSEA-VOMITING-COHERENCE"
    source_version_or_date: "2026-08-31"
    evidence_strength: expert_consensus
    review_status: approved_for_training
    reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
    reviewed_at: "2026-08-31"
    second_review_required: true
    second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
    second_reviewed_at: "2026-09-01"
    next_review_due: null
    notes: >-
      Clinical Lead has ACCEPTED the uniform draw as non-epidemiological
      simulation sampling (not a prevalence claim).
      Second Clinical Reviewer Decision, 2026-09-01: APPROVED — "the
      generated symptom mix is clinically plausible for acute appendicitis
      and acceptable for simulation diversity"; exclusion of
      vomiting-without-nausea remains understood as a scenario-scope
      restriction, not a universal clinical rule.

# ---------------------------------------------------------------------------
# Sex-conditional history (matrix P03, task §11)
# ---------------------------------------------------------------------------
# `applies_to_sex` is honoured by the generator; a male patient can never
# receive an LMP or a pregnancy-possibility line, and no female-specific rule
# has a male patient to fire against.
sex_conditional_history:
  - id: reproductive_age_female_history
    applies_to_sex: female
    applies_to_age_years: [18, 55]
    lines_ru:
      - "последняя менструация — уточняется у пациентки при сборе анамнеза"
      - "беременность не исключена, тест не выполнялся"
      - "патологических выделений и болей внизу живота слева нет"
    provenance:
      id: HISTORY-REPRODUCTIVE-AGE-FEMALE
      authority_layer: patient_truth
      jurisdiction: international
      source: "Clinical reviewer decision, matrix P03; cross-specialty item, matrix I11"
      source_version_or_date: "2026-08-25"
      evidence_strength: expert_consensus
      review_status: pending
      reviewed_by: null
      reviewed_at: null
      second_review_required: true
      second_reviewed_by: null
      second_reviewed_at: null
      next_review_due: null
      notes: "NEEDS_SECOND_REVIEW (radiology/anaesthesia) per matrix I11. Pregnancy status is never invented."

