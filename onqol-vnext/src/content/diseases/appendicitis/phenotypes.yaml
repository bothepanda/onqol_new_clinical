  # =========================================================================
  # APP-004
  # =========================================================================
  retrocecal:
    phenotype_id: retrocecal
    title_ru: "Ретроцекальное расположение"
    compatible_morphologies: [uncomplicated_inflammation]
    key_skill_ru: "Понимать ограничения осмотра и УЗИ, выбирать КТ, наблюдение или безопасный маршрут"
    presentation:
      # Matrix P04 / task §5.3: most uncomplicated patients present within
      # ~24 h. 3+ day presentations belong to a different severity trajectory
      # and MUST NOT be generated in this phenotype. APP004 Numeric Calibration
      # Review 2026-08-31 (RETROCECAL): Clinical Lead APPROVED 6–24 h uniform;
      # the extended 30–36 h window and its (never-reviewed) share were REMOVED
      # for the pilot rather than left as disabled pseudo-precision.
      hours_from_onset: [6, 24]
      # APP004 Numeric Calibration Review (RETROCECAL): Clinical Lead APPROVED
      # pain score 4–8 uniform.
      pain_score: [4, 8]
      # Matrix P05: retrocecal position can be atypical but does NOT forbid
      # RLQ pain. APP004 Numeric Calibration Review (RETROCECAL): the "less
      # often" RUQ / right-flank sites and their unreviewed share were REMOVED
      # for the pilot; the phenotype draws uniformly from this reviewed list.
      pain_sites_ru:
        - "в правом боку"
        - "в пояснице справа"
        - "в правой подвздошной области"
      history_variants_ru:
        - "усиливается при ходьбе"
        - "усиливается при разгибании правого бедра"
      # Matrix P07: common, realistic, does not alter the diagnosis.
      self_treatment_variants_ru:
        - null # no self-treatment
        - "накануне принимал(а) обезболивающее без стойкого эффекта"
        - "накануне принимал(а) спазмолитик без стойкого эффекта"
      # Matrix P08 / task §5.6. Named appendiceal signs (Rovsing, Sitkovsky,
      # Bartomier-Michelson) are deliberately ABSENT: matrix P09 removes the
      # ritual sign checklist. Psoas remains as an optional useful finding for
      # a retrocecal appendix.
      examination_slots:
        contour: обычный
        palpation: мягкий
        tenderness: "локальная умеренная"
        max_point: "по локализации боли"
        guarding: нет
        rebound: отрицательный
        peristalsis: выслушивается
      examination_slot_choices:
        psoas: [положительный, отрицательный]
      # APP004 Numeric Calibration Review 2026-08-31 (RETROCECAL): Clinical Lead
      # set the psoas positive/negative split to 25/75 (positive is the less
      # common finding). Parallel array; index-aligned to examination_slot_choices.
      examination_slot_weights:
        psoas: [25, 75]
      # Matrix V06: small nonspecific findings are permitted for a retrocecal
      # appendix and are NEVER diagnostic of UTI/stone/pyelonephritis by
      # themselves. Wording is qualitative on purpose - no counts, because no
      # count has been reviewed.
      urinalysis_variants_ru:
        - "Общий анализ мочи без значимых отклонений."
        - "В общем анализе мочи единичные лейкоциты; нитриты отрицательные, бактериурии нет."
        - "В общем анализе мочи единичные эритроциты; нитриты отрицательные, бактериурии нет."
      # APP004 Numeric Calibration Review 2026-08-31 (RETROCECAL): Clinical Lead
      # set the urinalysis mix to 60/20/20 (no abnormality / single leukocytes /
      # single erythrocytes). Index-aligned to urinalysis_variants_ru.
      urinalysis_variants_weights: [60, 20, 20]
    imaging:
      # Matrix I02/I03: nondiagnostic, NOT negative. The renderer is forbidden
      # to phrase this as "УЗИ отрицательное на аппендицит"
      # (see ai/renderer/renderEvent.js and its regression test).
      ultrasound_ru: >-
        Аппендикс достоверно не визуализирован; выраженная пневматизация кишечника.
        Убедительных очаговых изменений в доступных отделах брюшной полости не выявлено.
        Заключение: исследование неинформативно в отношении аппендикса.
      # APP004 Numeric Calibration Review 2026-08-31 (RETROCECAL): the disabled
      # partial-visualisation ultrasound variant and its unreviewed share were
      # REMOVED for the pilot. The ultrasound is a fixed qualitative
      # "not reliably visualised" narrative.
      # Matrix I04 / task §9.2: the case begins as an undifferentiated acute
      # abdomen, so CT is rendered as a FULL abdomen/pelvis report, not an
      # "appendix-only" test. No appendix diameter appears anywhere: matrix
      # I05 leaves the numeric range NEEDS SOURCE, and §20 forbids the
      # renderer inventing one.
      ct_report_ru:
        modality_ru: "КТ органов брюшной полости и малого таза с в/в контрастированием"
        sections:
          - id: liver
            text_ru: "Печень обычных размеров и структуры, очаговых образований не выявлено."
          - id: biliary
            text_ru: "Желчный пузырь без признаков острого воспаления, стенка не утолщена, конкрементов не выявлено."
          - id: pancreas
            text_ru: "Поджелудочная железа обычной формы, парапанкреатическая клетчатка не инфильтрирована."
          - id: spleen
            text_ru: "Селезёнка не увеличена, структура однородная."
          - id: urinary
            text_ru: "Почки расположены обычно, чашечно-лоханочные системы не расширены, конкрементов и обструкции не выявлено."
          - id: bowel
            text_ru: "Петли тонкой и толстой кишки не расширены, признаков непроходимости и утолщения стенок не выявлено."
          - id: free_air
            text_ru: "Свободного газа в брюшной полости не выявлено."
          - id: pelvis
            text_ru: "Органы малого таза без признаков острой патологии."
          - id: appendix
            text_ru: >-
              Червеобразный отросток расположен ретроцекально, увеличен, стенка утолщена,
              накапливает контраст; окружающая жировая клетчатка инфильтрирована.
              Признаков перфорации, абсцесса и свободного газа не выявлено.
        # Matrix I07: seeded none vs small local/pelvic fluid. Matrix I01/I09:
        # NO appendicolith and NO incidental findings in base APP-004.
        free_fluid_variants:
          - id: none
            text_ru: "Свободной жидкости в брюшной полости и малом тазу не выявлено."
          - id: small_local
            text_ru: "Определяется небольшое количество свободной жидкости в правой подвздошной области."
          - id: small_pelvic
            text_ru: "Определяется небольшое количество свободной жидкости в малом тазу."
        # APP004 Numeric Calibration Review 2026-08-31 (RETROCECAL): Clinical
        # Lead set the CT free-fluid mix to 70/15/15 (none / small RLQ / small
        # pelvic). Index-aligned to free_fluid_variants.
        free_fluid_variants_weights: [70, 15, 15]
        conclusion_ru: >-
          Заключение: КТ-картина острого аппендицита при ретроцекальном расположении отростка.
          Другой острой патологии не выявлено.
        preliminary_ru: >-
          Предварительно по телефону: картина острого аппендицита, отросток расположен ретроцекально;
          признаков перфорации и абсцесса не вижу. Формальное заключение будет позже.
      # Matrix O07: objective intra-op truth.
      operative_truth_ru: >-
        Аппендикс расположен ретроцекально, воспалительно изменён, без перфорации и без гангренозных изменений.
        Другой явной острой патологии в осмотренных отделах не выявлено.
    # APP004 Numeric Calibration Review 2026-08-31 (RETROCECAL) — Clinical Lead
    # decisions applied to the numeric remainder of this phenotype:
    #   APPROVE   hours_from_onset 6–24 h uniform
    #   APPROVE   pain_score 4–8 uniform
    #   REMOVE    hours_from_onset_extended (+ _enabled, _share)
    #   REMOVE    pain_sites_uncommon_ru (+ _enabled, _share)
    #   REMOVE    ultrasound_visualized_variant_ru (+ _enabled, _share)
    #   REVISE    urinalysis_variants mix -> 60/20/20
    #   REVISE    CT free_fluid mix -> 70/15/15
    #   REVISE    psoas positive/negative -> 25/75
    #   APPROVE   self_treatment_variants_ru uniform (unchanged)
    numeric_calibration_removed_for_pilot:
      - hours_from_onset_extended
      - hours_from_onset_extended_enabled
      - hours_from_onset_extended_share
      - pain_sites_uncommon_ru
      - pain_sites_uncommon_enabled
      - pain_sites_uncommon_share
      - ultrasound_visualized_variant_ru
      - ultrasound_visualized_enabled
      - ultrasound_visualized_share
    provenance:
      id: PHENOTYPE-RETROCECAL-APP004
      authority_layer: patient_truth
      jurisdiction: international
      source: "APP004 Numeric Calibration Review 2026-08-31 (RETROCECAL); APP004_CLINICAL_REVIEW_MATRIX_v1.0_2026-08-25 §3, §5 (P01-P10, I01-I09, V06)"
      source_version_or_date: "2026-08-31"
      evidence_strength: expert_consensus
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-08-31"
      second_review_required: true
      second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
      second_reviewed_at: "2026-09-01"
      next_review_due: null
      notes: >-
        Matrix §G1: patient generation is Patient Truth and cannot be a permanent
        exception to the runtime gate. Clinical Lead has recorded APPROVE / REMOVE
        / REVISE for every numeric and variant-frequency item in this phenotype
        (see comment above and the APP004 Numeric Calibration Review). No appendix
        diameter is claimed anywhere. The already-approved wording lives in
        PHENOTYPE-RETROCECAL-APP004-QUALITATIVE and was not reopened here.
        Second Clinical Reviewer Decision, 2026-09-01: APPROVED — "the 6–24 h
        history window, pain range, low-frequency positive psoas sign, minor
        urinalysis abnormalities and limited free-fluid variants are clinically
        plausible for a narrow resident pilot"; exact percentages remain
        simulation calibration, not prevalence/sensitivity/specificity.

    qualitative_truth:
      scope: "retrocecal uncomplicated APP-004 history, examination, imaging and operative wording"
      provenance:
        id: PHENOTYPE-RETROCECAL-APP004-QUALITATIVE
        authority_layer: patient_truth
        jurisdiction: international
        source: "APP-004 — Second Clinical Review, 2026-08-31; APP004 Clinical Activation Decisions v1.1"
        source_version_or_date: "2026-08-31"
        evidence_strength: expert_consensus_plus_guideline
        review_status: approved_for_training
        reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
        reviewed_at: "2026-08-31"
        second_review_required: true
        second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
        second_reviewed_at: "2026-08-31"
        next_review_due: null
        notes: "Qualitative claim only. The enclosing phenotype remains pending because it also generates unreviewed durations, pain, urinalysis and variant frequencies."

  # Preserved only as a faculty/development case. V3.5 already kept APP-005
  # inactive because the unstable-patient engine and treatment response were
  # not reviewed.
