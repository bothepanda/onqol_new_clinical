    removed_because: "Renamed and rewritten as RULE-DELAY-BEYOND-24H-UNCOMPLICATED (matrix T04); the old wording penalised any non-immediate operation."
  - id: RULE-SITE-MARKING-REQUIRED
    removed_because: "matrix PR12 REMOVE — low educational relevance for single-structure appendectomy."
  - id: RULE-FOLEY-REQUIRED
    removed_because: "matrix PR11 REMOVE — no universal urinary-catheter requirement for uncomplicated laparoscopic appendectomy."
  - id: RULE-LMWH-REQUIRED
    removed_because: "matrix PR14 REMOVE — VTE prophylaxis must match risk (SRC-SAGES-VTE)."
  - id: RULE-US-BEFORE-CT
    removed_because: "matrix I01 REMOVE — US is not a mandatory prerequisite before CT in an adult (SRC-ACR-ABD)."
  - id: RULE-NPO-HARD-STOP
    removed_because: "matrix PR01 REMOVE — ASA elective fasting guidance does not govern emergency acute abdomen."
  - id: RULE-CREATININE-BEFORE-CONTRAST
    removed_because: "matrix I12 — if enforced at all this is a HOSPITAL/radiology department policy, never a universal clinical contraindication. Implemented in core/hospital/hospitalProfiles.js."

