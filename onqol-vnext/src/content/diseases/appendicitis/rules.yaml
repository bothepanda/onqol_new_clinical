# Reviewed clinical rules for the appendicitis vertical slice.
#
# Remediated 2026-08-25 against APP004_CLINICAL_REVIEW_MATRIX_v1.0_2026-08-25
# §14 (critical corrections to current blocked content).
#
# `level` is one of the four safety levels (Core Runtime Spec §57) and is never
# shown to the learner. `authority_layer` is new in this pass and is what keeps
# a hospital/jurisdiction workflow requirement from being taught as universal
# medicine (matrix §13).
#
# NOTHING in this file is `approved_for_training`. Every rule below therefore
# reaches the runtime only through `governanceBlockedEligibleRules` - as an
# audit record, never as authority.
schema_version: "1.0"

rules:
  # -------------------------------------------------------------------------
  # Matrix PR05 / §14: REVISED.
  #
  # Was LEVEL_4_CATASTROPHIC. Consent is essential, but its absence is a
  # procedural / ethical / legal readiness failure, not a physiologic
  # catastrophe that harms the patient - modelling it as Level 4 taught the
  # wrong thing about WHY consent matters. The operation stays blocked without
  # consent, but structurally (core/state/worldState.js#derivePreopReady),
  # which is an architecture invariant and does not depend on this rule.
  # -------------------------------------------------------------------------
  - id: RULE-CONSENT-BEFORE-PROCEDURE
    topic: consent_required_before_operative_access
    level: LEVEL_2_EDUCATIONAL
    authority_layer: clinical_workflow
    blocks_execution_via: structural_preop_readiness_gate
    conditions:
      - type: commandTypeIs
        commandType: START_PROCEDURE
      - type: consentNotObtained
    teaching_point_ru: >-
      Плановый оперативный доступ не начинают без оформленного информированного
      согласия. Достаточно объяснить операцию, значимые риски и альтернативы и
      получить согласие — отдельный опрос по каждому пункту бланка не требуется.
    source_ids: [SRC-WSES-2025]
    provenance:
      id: RULE-CONSENT-BEFORE-PROCEDURE
      authority_layer: clinical_workflow
      jurisdiction: international
      source: "APP004_CLINICAL_REVIEW_MATRIX_v1.0_2026-08-25 PR04, PR05"
      source_version_or_date: "2026-08-25"
      evidence_strength: expert_consensus
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-08-31"
      second_review_required: true
      second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
      second_reviewed_at: "2026-08-31"
      next_review_due: null
      notes: >-
        Route/readiness omission only; approved after listed edits and must not
        generate invented physiology or a Level-4 label.
    score_weight: 0

  # -------------------------------------------------------------------------
  # Matrix T04 / §14: REVISED.
  #
  # WSES 2025 states appendectomy for UNCOMPLICATED appendicitis may be safely
  # delayed WITHIN 24 h without increased adverse outcomes. The previous rule
  # id and wording ("задержка свыше 24 часов от поступления") both measured
  # and phrased the claim wrongly: the condition measures from the moment the
  # operative plan was committed, not from arrival, and the old text read as a
  # penalty on any non-immediate operation.
  # -------------------------------------------------------------------------
  - id: RULE-DELAY-BEYOND-24H-UNCOMPLICATED
    topic: TRAP-DELAY-BEYOND-24H
    level: LEVEL_2_EDUCATIONAL
    authority_layer: clinical_rule
    conditions:
      - type: managementIntentIs
        intent: operative
      - type: minutesSincePlanCommittedGte
        minutes: 1440
      - type: procedureNotStarted
    teaching_point_ru: >-
      При неосложнённом аппендиците, отобранном для операции, отсрочка в пределах
      24 часов не связана с ухудшением исходов — торопиться «в течение часа» не нужно.
      Здесь прошло больше 24 часов от принятия решения оперировать, и это уже за
      пределами изученного безопасного окна. Что удерживает от операции сейчас?
    source_ids: [SRC-WSES-2025]
    provenance:
      id: RULE-DELAY-BEYOND-24H-UNCOMPLICATED
      authority_layer: clinical_rule
      jurisdiction: international
      source: "WSES Jerusalem Guidelines 2025 (SRC-WSES-2025); matrix T04"
      source_version_or_date: "2026-03"
      evidence_strength: guideline
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-08-31"
      second_review_required: true
      second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
      second_reviewed_at: "2026-08-31"
      next_review_due: null
      notes: >-
        Approved for stable uncomplicated APP-004. The 24-hour window is
        permission, not a target delay or a requirement to wait.
    score_weight: 0

  # -------------------------------------------------------------------------
  # Matrix AB05 / §14 / task §16.3: AUDITED AND DOWNGRADED.
  #
  # The previous rule taught "стандартная периоперационная профилактика
  # цефазолином — 2 г в/в" as settled. ASHP/SIS/SHEA/IDSA surgical prophylaxis
  # guidance lists appendectomy prophylaxis as cefazolin PLUS metronidazole, or
  # an agent with anaerobic cover (cefoxitin/cefotetan) - cefazolin
  # MONOTHERAPY is not the standard appendectomy regimen. The rule no longer
  # asserts monotherapy sufficiency, and its status was lowered from
  # `reviewed_internal` to `pending`: the prior internal review approved a
  # claim the source does not support.
  # -------------------------------------------------------------------------
  - id: RULE-CEFAZOLIN-PROPHYLAXIS-DOSE
    topic: dosing.cefazolin.prophylaxis
    level: LEVEL_2_EDUCATIONAL
    authority_layer: clinical_rule
    conditions:
      - type: commandTypeIs
        commandType: GIVE_ANTIBIOTIC_PROPHYLAXIS
      - type: commandParamEquals
        param: drugId
        value: cefazolin
      - type: commandParamOutsideRange
        param: doseMg
        min: 2000
        max: 3000
    teaching_point_ru: >-
      Проверь дозу цефазолина и то, чем перекрывается анаэробная флора: для
      аппендэктомии цефазолин в монотерапии не является стандартной схемой
      периоперационной профилактики.
    source_ids: [SRC-ASHP-PROPH, SRC-WSES-2025]
    knf_note: "КНФ РК приводит отличную схему (1 г, редозинг 0.5-1 г q6-8h); расхождение обсуждается в дебрифе, не как автоматическая коррекция резидента."
    allowed_runtime_effects: [mentor_teaching]
    provenance:
      id: RULE-CEFAZOLIN-PROPHYLAXIS-DOSE
      authority_layer: clinical_rule
      jurisdiction: international
      source: "ASHP/SIS/SHEA/IDSA surgical prophylaxis (SRC-ASHP-PROPH); matrix AB04, AB05"
      source_version_or_date: "2013 (AJHP 70(3):195-283)"
      evidence_strength: guideline
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-08-31"
      second_review_required: true
      second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
      second_reviewed_at: "2026-08-31"
      next_review_due: null
      notes: >-
        Dose boundary and complete multi-drug regimens were independently
        reviewed on 2026-08-31. Weight-dependent 3 g execution still requires
        modeled weight; cefazolin monotherapy never completes prophylaxis.
      superseded_review:
        reviewers: ["Сарина Т.Т.", "Каукенова Б.Н."]
        reviewed_at: "2026-08-20"
        withdrawn_because: "Cefazolin monotherapy asserted as the standard appendectomy prophylaxis regimen."
    score_weight: 0

  - id: RULE-CEFAZOLIN-REQUIRES-ANAEROBIC-COVERAGE
    topic: prophylaxis.cefazolin.complete_regimen
    level: LEVEL_2_EDUCATIONAL
    authority_layer: clinical_rule
    conditions:
      - type: commandTypeIs
        commandType: GIVE_ANTIBIOTIC_PROPHYLAXIS
      - type: commandParamEquals
        param: drugId
        value: cefazolin
    teaching_point_ru: >-
      Цефазолин для аппендэктомии должен быть частью полной схемы с
      анаэробным покрытием; в APP-004 он не завершает профилактику без
      метронидазола.
    source_ids: [SRC-ASHP-PROPH, SRC-WSES-2025]
    allowed_runtime_effects: [mentor_teaching]
    provenance:
      id: RULE-CEFAZOLIN-REQUIRES-ANAEROBIC-COVERAGE
      authority_layer: clinical_rule
      jurisdiction: international
      source: "ASHP/SIS/SHEA/IDSA surgical prophylaxis; APP-004 Second Clinical Review ABX-05"
      source_version_or_date: "2013; reviewed 2026-08-31"
      evidence_strength: guideline_plus_expert_consensus
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-08-31"
      second_review_required: true
      second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
      second_reviewed_at: "2026-08-31"
      next_review_due: null
      notes: "Teaching-only rule; the deterministic pre-incision gate separately validates the complete regimen and 60-minute window."
    score_weight: 0

  # -------------------------------------------------------------------------
  # Matrix O10 / MR03 / §14: REVISED THEN APPROVE (pending reviewer identity).
  # Mentor asks WHY; if the learner insists the drain is placed; debrief calls
  # it unnecessary, never catastrophic.
  # -------------------------------------------------------------------------
  - id: RULE-ROUTINE-DRAIN-UNCOMPLICATED
    topic: TRAP-ROUTINE-DRAIN
    level: LEVEL_1_DEFENSIBLE
    authority_layer: clinical_rule
    conditions:
      - type: commandTypeIs
        commandType: OPERATIVE_DECISION
      - type: commandParamEquals
        param: choice
        value: place_drain
    teaching_point_ru: >-
      Рутинное дренирование после лапароскопической аппендэктомии не поддержано
      текущими рекомендациями — WSES не рекомендует дренирование даже при
      осложнённом аппендиците. Зачем здесь дренаж? Если есть отдельное основание,
      поставь и обоснуй в дебрифе.
    source_ids: [SRC-WSES-2025, SRC-WSES-2020]
    provenance:
      id: RULE-ROUTINE-DRAIN-UNCOMPLICATED
      authority_layer: clinical_rule
      jurisdiction: international
      source: "WSES 2020/2025 (SRC-WSES-2020, SRC-WSES-2025); matrix O10, MR03"
      source_version_or_date: "2026-03"
      evidence_strength: guideline
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-08-31"
      second_review_required: false
      second_reviewed_by: null
      second_reviewed_at: null
      next_review_due: null
      notes: "Approved after listed edits; a routine drain is unnecessary care, not a catastrophic action."
    score_weight: 0

  # -------------------------------------------------------------------------
  # Matrix AB08 / PO04: NEW. No routine postoperative antibiotics after
  # uncomplicated appendicitis. The system never administers them by itself
  # (see docs/review/APP004_CLINICAL_REMEDIATION_REPORT_2026-08-25.md); this
  # rule exists so that, once approved, a prolonged course ordered by the
  # learner can be challenged rather than silently accepted.
  # -------------------------------------------------------------------------
  - id: RULE-NO-ROUTINE-POSTOP-ANTIBIOTICS-UNCOMPLICATED
    topic: TRAP-ROUTINE-POSTOP-ANTIBIOTICS
    level: LEVEL_2_EDUCATIONAL
    authority_layer: clinical_rule
    conditions:
      - type: commandTypeIs
        commandType: ORDER_MEDICATION
      - type: commandParamHasTag
        param: drugId
        tag: antibiotic
      - type: sourceControlAchieved
    teaching_point_ru: >-
      После аппендэктомии по поводу неосложнённого аппендицита продолжение
      антибиотиков не рекомендовано. Какое показание к продолжению курса ты видишь
      у этого пациента?
    source_ids: [SRC-WSES-2025]
    provenance:
      id: RULE-NO-ROUTINE-POSTOP-ANTIBIOTICS-UNCOMPLICATED
      authority_layer: clinical_rule
      jurisdiction: international
      source: "WSES 2025 (SRC-WSES-2025) strong recommendation against postoperative antibiotics; matrix AB08, PO04"
      source_version_or_date: "2026-03"
      evidence_strength: guideline
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-08-31"
      second_review_required: true
      second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
      second_reviewed_at: "2026-08-31"
      next_review_due: null
      notes: "Approved for uncomplicated appendectomy with adequate source control."
    score_weight: 0

  # -------------------------------------------------------------------------
  # Matrix O01 / MR04: NEW. Laparoscopy is preferred where equipment and
  # expertise exist. Deliberately LEVEL_1: open appendectomy remains a valid
  # operation, and the simulator must never claim it is impossible.
  #
  # NOTE: the mentor's "why open?" question during play is NOT driven by this
  # rule (which is unapproved and therefore inert). It is a structural
  # question keyed to a HOSPITAL RESOURCE FACT - the laparoscopy stack is
  # available - and asserts no clinical claim. See ai/mentor/mentorEngine.js.
  # -------------------------------------------------------------------------
  - id: RULE-LAPAROSCOPIC-PREFERRED-WHEN-AVAILABLE
    topic: laparoscopic_approach_preferred
    level: LEVEL_1_DEFENSIBLE
    authority_layer: clinical_rule
    conditions:
      - type: commandTypeIs
        commandType: START_PROCEDURE
      - type: commandParamEquals
        param: approach
        value: open
      - type: hospitalCapabilityAvailable
        capabilityKey: laparoscopy
    teaching_point_ru: >-
      Лапароскопическая аппендэктомия остаётся стандартом там, где есть стойка и
      владение методикой. Открытый доступ не запрещён и остаётся защитимым выбором —
      но обоснуй, почему здесь он предпочтительнее.
    source_ids: [SRC-WSES-2020, SRC-WSES-2025]
    provenance:
      id: RULE-LAPAROSCOPIC-PREFERRED-WHEN-AVAILABLE
      authority_layer: clinical_rule
      jurisdiction: international
      source: "WSES 2020 strong 1A; WSES 2025; matrix O01, O02, MR04"
      source_version_or_date: "2026-03"
      evidence_strength: guideline
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-08-31"
      second_review_required: false
      second_reviewed_by: null
      second_reviewed_at: null
      next_review_due: null
      notes: "Approved after listed edits; open appendectomy remains a valid alternative."
    score_weight: 0

