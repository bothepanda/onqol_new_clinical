# ---------------------------------------------------------------------------
# Post-source-control course (matrix T05, PO01)
# ---------------------------------------------------------------------------
# Postoperative pain is a DIFFERENT state from appendicitis pain, not the same
# variable decremented. The structural transition happens in
# core/state/worldState.js SOURCE_CONTROL_COMPLETED.
#
# APP004 Numeric Calibration Review 2026-08-31 (POSTOP) — Clinical Lead
# decision: REVISE. A bounded, criteria-based uncomplicated postoperative
# recovery model is authored below to the Clinical Lead's design brief.
#
# Second Clinical Reviewer Decision, 2026-09-01 (Sarina T.T.): REVISE. The
# recovery-clock anchor was SOURCE_CONTROL_COMPLETED, which can precede
# completion of the operation, anaesthetic maintenance and surgical closure.
# Fixed: the clock (`postop.recovery.enteredAtMinutes`) now starts at
# PROCEDURE_COMPLETED (`core/state/worldState.js`, `core/time/advanceTime.js`)
# - the operation-complete event, which carries the closure statement and is
# immediately followed by the move to recovery. Nothing else in this block
# changed: the two windows, weights, qualitative pain states and the
# discharge-readiness contract below are exactly as the Clinical Lead
# authored them.
#
# Focused Second Clinical Re-Review, 2026-09-01 (Sarina T.T.): APPROVE, scope
# limited to the clock-anchor change alone (SOURCE_CONTROL_COMPLETED ->
# PROCEDURE_COMPLETED). With that re-review recorded, this object is promoted
# to `review_status: approved_for_training` and the model is now RUNTIME-
# AUTHORITATIVE: advanceTime.js#buildPostoperativeRecoveryEvents runs it once
# the operation is complete instead of emitting SIMULATOR_LIMITATION_NOTED.
# The windows, weights, qualitative pain states and discharge-readiness
# contract below were NOT re-reviewed (unchanged) and are untouched
# (docs/review/APP004_POSTOP_CLOCK_ANCHOR_REREVIEW_2026-09-01.md).
#
# DESIGN CONSTRAINTS BAKED IN (do not relax without re-review):
#   - The recovery window is NOT a discharge timer. Window end means only that
#     an uncomplicated patient would normally be expected to have reached the
#     relevant recovery phase. It MUST NOT set any discharge criterion to
#     "met" and MUST NOT override an unmet criterion.
#   - Functional milestones only. No deterministic per-hour HR / temperature /
#     CRP / pain arithmetic. No numeric pain-decay curve.
#   - Postoperative pain is a qualitative bounded state:
#     significant -> improving -> controlled_on_oral_analgesia.
#   - No new treatment-effect magnitudes are introduced here; progression
#     depends on learner actions / reassessment already modelled elsewhere.
#     Omitted or inadequate postoperative care must not be silently converted
#     into successful recovery merely because time passed.
#   - The two windows are simulation-diversity configuration, NOT epidemiological
#     prevalence and NOT guideline-mandated lengths of stay.
post_source_control_course:
  # Seeded per patient (patientGenerator.js drawPostopRecoveryVariant). The
  # window scales the milestone expectation; it does not schedule a discharge.
  recovery_variants:
    - id: early_recovery
      recovery_window_hours: [6, 12]
    - id: overnight_recovery
      recovery_window_hours: [12, 24]
  recovery_variant_weights: [50, 50] # simulation diversity only; not prevalence
  recovery_variant_weights_are_epidemiological: false

  # Qualitative bounded postoperative pain states for this pilot. No numbers.
  postop_pain_states: [significant, improving, controlled_on_oral_analgesia]

  # The learner-visible recovery domains the model must express. Discharge
  # readiness is evaluated criterion-by-criterion from current patient state
  # (complications.yaml discharge_criteria), never from window elapsed.
  recovery_domains:
    - anaesthesia_emergence          # consciousness / recovery from anaesthesia
    - haemodynamic_respiratory_stability
    - postoperative_pain
    - nausea_vomiting
    - oral_intake_tolerance
    - mobilisation
    - bleeding_or_wound_concern
    - ready_for_discharge_assessment

  discharge_readiness_contract:
    evaluated_from: current_patient_state_per_criterion
    window_end_effect: expectation_only_never_override
    blocks_if_any_true:
      - pain_not_controlled_on_oral_analgesia
      - clinically_significant_persistent_nausea_or_vomiting
      - oral_intake_not_tolerated
      - mobilisation_unsafe
      - vital_signs_unstable
      - active_bleeding_or_wound_concern

  model:
    kind: bounded_state_transitions
    initial_state_id: pacu_emergence
    # NEEDS_CLINICAL_RE_REVIEW: states and milestone gates are authored to the
    # design brief. Transition probabilities are 1 (deterministic milestone
    # gates on conditions + variant-scaled eligibility), NOT invented hazard
    # rates. Effects set qualitative phase/pain-stage flags only.
    states:
      - id: pacu_emergence
        domain_focus: [anaesthesia_emergence, haemodynamic_respiratory_stability]
        postop_pain_state: significant
      - id: early_ward_recovery
        domain_focus: [postoperative_pain, nausea_vomiting, mobilisation]
        postop_pain_state: improving
      - id: recovered_uncomplicated
        domain_focus: [oral_intake_tolerance, mobilisation, ready_for_discharge_assessment]
        postop_pain_state: controlled_on_oral_analgesia
    transitions:
      - id: emergence_to_early_ward__early
        from: pacu_emergence
        to: early_ward_recovery
        probability: 1
        eligible_after_minutes: 90
        conditions:
          - { path: truth.postopRecoveryVariantId, operator: equals, value: early_recovery }
        effects:
          symptoms: { postopPainStage: { set: improving } }
          truth: { recoveryPhase: { set: early_ward_recovery } }
      - id: emergence_to_early_ward__overnight
        from: pacu_emergence
        to: early_ward_recovery
        probability: 1
        eligible_after_minutes: 120
        conditions:
          - { path: truth.postopRecoveryVariantId, operator: equals, value: overnight_recovery }
        effects:
          symptoms: { postopPainStage: { set: improving } }
          truth: { recoveryPhase: { set: early_ward_recovery } }
      - id: early_ward_to_recovered__early
        from: early_ward_recovery
        to: recovered_uncomplicated
        probability: 1
        eligible_after_minutes: 360   # low end of the 6–12 h window; expectation only
        conditions:
          - { path: truth.postopRecoveryVariantId, operator: equals, value: early_recovery }
        effects:
          symptoms: { postopPainStage: { set: controlled_on_oral_analgesia } }
          truth: { recoveryPhase: { set: recovered_uncomplicated } }
      - id: early_ward_to_recovered__overnight
        from: early_ward_recovery
        to: recovered_uncomplicated
        probability: 1
        eligible_after_minutes: 720   # low end of the 12–24 h window; expectation only
        conditions:
          - { path: truth.postopRecoveryVariantId, operator: equals, value: overnight_recovery }
        effects:
          symptoms: { postopPainStage: { set: controlled_on_oral_analgesia } }
          truth: { recoveryPhase: { set: recovered_uncomplicated } }

  provenance:
    id: TRJ-POSTOP-RECOVERY
    authority_layer: patient_truth
    jurisdiction: international
    source: "APP004 Numeric Calibration Review 2026-08-31 (POSTOP) — Clinical Lead authored design brief"
    source_version_or_date: "2026-08-31"
    evidence_strength: expert_consensus
    review_status: approved_for_training
    reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
    reviewed_at: "2026-08-31"
    second_review_required: true
    second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
    second_reviewed_at: "2026-09-01"
    next_review_due: null
    model_status: re_reviewed_runtime_authoritative
    notes: >-
      Clinical Lead REVISE decision: two seeded uncomplicated recovery variants
      (early_recovery 6–12 h, overnight_recovery 12–24 h, 50/50 simulation
      diversity), criteria-based functional milestones, qualitative bounded
      postoperative pain states only, NO per-hour vital-sign arithmetic, NO
      automatic discharge at 6/12/24 h, discharge criteria evaluated
      individually from current patient state. Transition probabilities are
      deterministic milestone gates, not invented hazard rates. See
      docs/review/APP004_VITALS_LABS_REVIEW_TABLE.md.

      Second Clinical Reviewer Decision, 2026-09-01 (Sarina T.T. — General
      Surgery / Surgical Oncology, NROC): REVISE — the recovery-clock anchor
      (SOURCE_CONTROL_COMPLETED) was clinically incorrect and has been fixed
      to PROCEDURE_COMPLETED (see docs/review/APP004_POSTOP_CLOCK_ANCHOR_REREVIEW_2026-09-01.md).
      No other part of this model changed.

      Focused Second Clinical Re-Review, 2026-09-01 (Sarina T.T. — General
      Surgery / Surgical Oncology, NROC): APPROVE — scope limited to the
      clock-anchor change from SOURCE_CONTROL_COMPLETED to PROCEDURE_COMPLETED.
      PROCEDURE_COMPLETED is an appropriate postoperative recovery anchor: it
      represents completion of the operative procedure including closure, sets
      the operative state to completed, and is immediately followed by transfer
      to the recovery phase, correctly separating intraoperative source-control
      completion from the start of postoperative/anaesthetic recovery. The 6–12 h
      / 12–24 h windows, 50/50 variant weights, qualitative postoperative pain
      states, recovery domains, bounded transition model and discharge-readiness
      logic were NOT re-reviewed (unchanged in this remediation) and remain
      exactly as the Clinical Lead authored them. With this focused re-review
      recorded as APPROVE, review_status is promoted to approved_for_training
      and the model is now runtime-authoritative
      (docs/review/APP004_POSTOP_CLOCK_ANCHOR_REREVIEW_2026-09-01.md).

