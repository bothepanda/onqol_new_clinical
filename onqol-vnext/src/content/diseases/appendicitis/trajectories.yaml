# Natural history and treatment-response parameters.
#
# Remediated 2026-08-25 against APP004_CLINICAL_REVIEW_MATRIX_v1.0_2026-08-25
# §6 (natural course), §7 (analgesia and fluids), §14 (critical corrections).
#
# WHAT WAS DELETED IN THIS PASS, AND WHY
#
#   pre_source_control_drift_per_hour   (HR +1, T +0.03, CRP +4, pain +0.15)
#   post_source_control_recovery_per_hour (pain -0.6, HR -1.5, T -0.05, CRP -3)
#     Matrix T01/T02/T05: a fixed per-hour arithmetic drift is not a
#     guideline-derived biological law, an untreated uncomplicated patient
#     does not necessarily worsen every hour, and postoperative recovery is a
#     NEW state after source control rather than the same appendicitis pain
#     counted backwards. Replaced by nothing: §4.9 says "Do not invent
#     replacement numbers."
#
#   crystalloid_bolus_500_1000ml -> heart_rate_delta -6, systolic_bp_delta +4
#     Matrix M08 / §14: a fixed hemodynamic delta for a stable euvolemic
#     patient is physiologically unjustified. Deleted, not re-parameterised.
#
#   analgesia_iv_nsaid -> pain_score_delta -3 across ketorolac+ketoprofen
#     Matrix M04/M05 / §12.1: one universal effect across different drugs and
#     routes. Replaced by per-drug, per-route entries whose response envelopes
#     are explicitly null pending pharmacy/clinical review.
#
#   antibiotic_prophylaxis -> infection risk reduction note
#     Matrix AB09: no numerical SSI-risk delta is invented. Prophylaxis is
#     recorded STRUCTURALLY (given, in a valid pre-incision window) only.
