# ---------------------------------------------------------------------------
# Investigation turnaround (Hospital/World Engine data, not a clinical rule)
# ---------------------------------------------------------------------------
investigation_timing:
  cbc: { etaMinutes: 40 }
  # Matrix V07 / task §8: "БХАК" alone must NOT return a hidden panel. The
  # order is incomplete until the learner names the analytes, and the LAB asks
  # - not the mentor.
  chemistry:
    etaMinutes: 45
    requires_parameter: analytes
    clarify_prompt_ru: "Какие показатели биохимии нужны?"
  crp: { etaMinutes: 40 } # matrix V08: SEPARATELY orderable, never auto-added
  urinalysis: { etaMinutes: 30 }
  betahcg: { etaMinutes: 35 }
  coagulation: { etaMinutes: 50 } # KZ jurisdictional preop (matrix PR09)
  blood_group_rh: { etaMinutes: 45 } # KZ jurisdictional preop (matrix PR08)
  ultrasound_abdomen: { etaMinutes: 45, preliminaryAtMinutes: 30 }
  ct_abdomen: { etaMinutes: 70, preliminaryAtMinutes: 45 }

# Matrix V07 / task §8: "БХАК" must NOT auto-populate a large panel. These are
# the analytes the learner may name; each carries its own reviewed qualitative
# result phrasing. Nothing here reports a NUMBER, because no reference range or
# value for this patient has been reviewed.
