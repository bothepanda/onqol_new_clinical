numeric_facts:
  # Matrix T04 / §14: WSES 2025 states appendectomy for UNCOMPLICATED
  # appendicitis may be safely delayed WITHIN 24 h without increased adverse
  # outcomes. That is a permission, not a deadline, and the runtime rule now
  # says so (see rules.yaml RULE-DELAY-BEYOND-24H-UNCOMPLICATED).
  safe_delay_window_uncomplicated_hours: 24
