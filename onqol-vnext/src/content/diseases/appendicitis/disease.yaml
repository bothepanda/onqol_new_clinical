# Matrix V03 / APP004 Numeric Calibration Review 2026-08-31 (ENV): Clinical Lead
# decision is REVISE to this linked 3-profile calibration, and the Clinical Lead
# has now supplied the verbatim ranges and selection weights below.
#
# These are expert-reviewed SIMULATION CALIBRATION ranges for generating
# coherent, stable, uncomplicated APP-004 patients. They are NOT diagnostic
# thresholds, NOT appendicitis severity criteria, NOT epidemiological
# distributions, NOT guideline cutoffs, NOT treatment triggers. Profile ID is
# hidden generation truth and is never disclosed to the learner. Nothing in the
# runtime may infer diagnosis, severity class, management, operative indication
# or a safety rule from profile membership.
#
# GENERATION CONTRACT (enforced in patientGenerator.js selectInflammatoryProfile):
#   - select exactly ONE profile per patient, then draw EVERY physiology /
#     laboratory field from that profile only (centred sampling); never mix
#     fields from different profiles;
#   - no symptom-duration coupling, no deterministic intra-profile correlation
#     beyond membership itself.
#
# STATUS: the three profiles are `approved_for_training` (Clinical Lead +
# second reviewer Sarina T.T., 2026-09-01) and `selection.generation_enabled`
# is now `true` — this is the active generation path for APP-004. An APP-004
# learner_pilot / production session MUST use these profiles and MUST fail the
# session gate (never silently fall back to the union envelope) if the
# calibration is missing, unapproved or invalid — see
# `evaluateInflammatoryCalibrationForPilot` in patientTruthGovernance.js,
# called from createSession.js.
inflammatory_profiles:
  selection:
    generation_enabled: true # ENV + 3 profiles approved_for_training, second review 2026-09-01 (Sarina T.T.)
    sampling: centred
    order: [minimal, moderate, marked_but_stable]
    # APP-004 pilot simulation-diversity configuration ONLY. This is NOT a
    # real-world prevalence estimate.
    weights_are_epidemiological_prevalence: false
    weights: [0.30, 0.50, 0.20] # minimal / moderate / marked_but_stable
  minimal:
    heart_rate: [72, 90]
    temperature_c: [36.6, 37.5]
    systolic_bp: [105, 140]
    respiratory_rate: [14, 18]
    wbc: [8.0, 11.5]
    neutrophil_percent: [65, 78]
    crp: [2, 25]
    generation_enabled: false
    provenance:
      id: PROFILE-INFLAMMATORY-MINIMAL
      authority_layer: patient_truth
      jurisdiction: international
      source: "APP004 Numeric Calibration Review 2026-08-31 (ENV) — Clinical Lead verbatim calibration values"
      source_version_or_date: "2026-08-31"
      evidence_strength: expert_consensus
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-08-31"
      second_review_required: true
      second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
      second_reviewed_at: "2026-09-01"
      next_review_due: null
      notes: >-
        Simulation calibration for a low-inflammation stable uncomplicated
        APP-004 patient. Not diagnostic thresholds or severity criteria.
        Second Clinical Reviewer Decision, 2026-09-01: APPROVED — "numeric
        ranges are clinically plausible for stable uncomplicated appendicitis";
        selection weights approved as simulation/curriculum calibration only,
        not epidemiological prevalence.
  moderate:
    heart_rate: [80, 98]
    temperature_c: [37.0, 38.0]
    systolic_bp: [105, 140]
    respiratory_rate: [14, 20]
    wbc: [10.5, 14.5]
    neutrophil_percent: [72, 85]
    crp: [10, 60]
    generation_enabled: false
    provenance:
      id: PROFILE-INFLAMMATORY-MODERATE
      authority_layer: patient_truth
      jurisdiction: international
      source: "APP004 Numeric Calibration Review 2026-08-31 (ENV) — Clinical Lead verbatim calibration values"
      source_version_or_date: "2026-08-31"
      evidence_strength: expert_consensus
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-08-31"
      second_review_required: true
      second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
      second_reviewed_at: "2026-09-01"
      next_review_due: null
      notes: >-
        Simulation calibration for a mid-range stable uncomplicated APP-004
        patient. Not diagnostic thresholds or severity criteria.
        Second Clinical Reviewer Decision, 2026-09-01: APPROVED — "numeric
        ranges are clinically plausible for stable uncomplicated appendicitis";
        selection weights approved as simulation/curriculum calibration only,
        not epidemiological prevalence.
  marked_but_stable:
    heart_rate: [90, 104]
    temperature_c: [37.5, 38.2]
    systolic_bp: [100, 135]
    respiratory_rate: [16, 21]
    wbc: [13.0, 16.5]
    neutrophil_percent: [80, 90]
    crp: [40, 100]
    generation_enabled: false
    provenance:
      id: PROFILE-INFLAMMATORY-MARKED
      authority_layer: patient_truth
      jurisdiction: international
      source: "APP004 Numeric Calibration Review 2026-08-31 (ENV) — Clinical Lead verbatim calibration values"
      source_version_or_date: "2026-08-31"
      evidence_strength: expert_consensus
      review_status: approved_for_training
      reviewed_by: ["Botagoz Kaukenova — Clinical Lead"]
      reviewed_at: "2026-08-31"
      second_review_required: true
      second_reviewed_by: ["Sarina T.T. — General Surgery / Surgical Oncology, NROC"]
      second_reviewed_at: "2026-09-01"
      next_review_due: null
      notes: >-
        Simulation calibration for a higher-inflammation but still HAEMODYNAMICALLY
        STABLE uncomplicated APP-004 patient. "marked_but_stable" is a simulation
