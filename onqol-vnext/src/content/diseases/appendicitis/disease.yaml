# ---------------------------------------------------------------------------
# Physiology generation
# ---------------------------------------------------------------------------
#
# Matrix V01/V03/V05: the single broad envelope below is NOT an approved
# "ordinary stable APP-004 patient" description. The reviewer's decision is
# that WBC/neutrophils/CRP/HR/T/RR must become LINKED inflammatory profiles
# (minimal / moderate / marked), and that the exact numeric envelopes have not
# been validated.
#
# What this pass does, and deliberately does not do:
#   - it does NOT invent minimal/moderate/marked numbers (task §6: "Do not
#     invent final numeric ranges"), so `inflammatory_profiles` ships as an
#     authored SCAFFOLD with null ranges awaiting the reviewer;
#   - it DOES delete the "later presentation => automatically higher every
#     lab" drift that used to bias every draw (matrix V04 REMOVE);
#   - the legacy union envelope is retained ONLY so a patient can still be
#     instantiated for internal development, and is explicitly flagged
#     `development_only: true`. `core/patient/patientTruthGovernance.js`
#     records it as non-approved patient truth on every session.
physiology_envelopes:
  uncomplicated_inflammation:
    heart_rate: [72, 112]
    temperature_c: [36.7, 38.5]
    systolic_bp: [100, 140]
    respiratory_rate: [14, 24]
    wbc: [8, 18]
    neutrophil_percent: [65, 90]
    crp: [2, 140]
    development_only: true
    provenance:
      id: ENV-UNCOMPLICATED-INFLAMMATION
      authority_layer: patient_truth
      jurisdiction: international
      source: null
      source_version_or_date: null
      evidence_strength: NEEDS_SOURCE
      review_status: pending
      reviewed_by: null
      reviewed_at: null
      second_review_required: true
      second_reviewed_by: null
      second_reviewed_at: null
      next_review_due: null
      notes: >-
        APP004 Numeric Calibration Review 2026-08-31 (ENV) — Clinical Lead
        decision: REVISE to the linked minimal/moderate/marked
        `inflammatory_profiles` calibration. This union envelope is NOT
        approved; it is retained only as the development-instantiation fallback
        until the Clinical Lead supplies the three profile range sets (and the
        per-profile selection weights) and re-review is recorded. The generator
        selection mechanism is already in place
        (`inflammatory_profiles.selection`, currently disabled).
        review_status stays pending. See
        docs/review/APP004_VITALS_LABS_REVIEW_TABLE.md.

        Second Clinical Reviewer Decision, 2026-09-01 (Sarina T.T.): the
        "ENV + inflammatory profiles" row was APPROVED, but her comment
        addresses the `inflammatory_profiles` numeric ranges (minimal /
        moderate / marked_but_stable) specifically, not this union envelope's
        own values, which were never themselves given a Clinical Lead first
        review (`reviewed_by` on this object has always been null). This
        object's own review_status is therefore left `pending` rather than
        promoted; the three linked profiles below carry the actual approved
        calibration and are now the active generation path
        (`inflammatory_profiles.selection.generation_enabled: true`). This
        envelope is retained only for internal development, replay
        compatibility and audit history, per the second reviewer's decision
        that the legacy envelope must not be used for learner_pilot /
        production generation.

  # Exact V3.5 faculty-preview envelope for APP-005. Preserved so the old case
  # can be reconstructed for review, not as an approved physiologic model.
  diffuse_peritonitis:
    heart_rate: [88, 140]
    temperature_c: [37.4, 39.5]
