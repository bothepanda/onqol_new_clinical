# Recognized medications/fluids for the appendicitis vertical slice.
#
# This is the "recognized" half of Foundation Spec §50's three-way
# distinction. A drugId not listed here is `unsupported_content` regardless of
# hospital mode - the platform does not model it yet, which is a simulator
# limitation and must never be phrased to the learner as "not in stock"
# (Contract §50.2, and behavioral regression #17 in the vNext task brief).
#
# `formulary_status` distinguishes REFERENCE availability (all listed drugs)
# from REAL-mode hospital-specific gaps, applied by the hospital profile, not
# hardcoded here.
schema_version: "1.0"

medications:
  cefazolin:
    label_ru: "цефазолин"
    reference_dose_range_mg: [2000, 3000]
    source_ids: [WSES2025]
  metronidazole:
    label_ru: "метронидазол"
    reference_dose_range_mg: [500, 500]
    source_ids: [WSES2025]
  ketorolac:
    label_ru: "кеторолак"
    class: nsaid_analgesic
  ketoprofen:
    label_ru: "кетопрофен"
    class: nsaid_analgesic

fluids:
  crystalloid:
    label_ru: "кристаллоидный раствор"

review_status: reviewed_internal
