  абсцесс простаты: prostatic_abscess

# Investigations the platform RECOGNISES but has no approved modeled result for
# in the case set (case allowlist = `investigation_timing` keys; anything listed
# here that a case does model is simply supported there). Ordering one is a
# recognised SIMULATOR LIMITATION: reported as such, never as a learner error,
# and never answered with a guessed alternative study. Adding a modeled result is
# a separate clinical-review item; it needs no interpreter change.
recognized_unmodeled_tests:
  - id: pelvic_ultrasound
    label_ru: "УЗИ органов малого таза"

