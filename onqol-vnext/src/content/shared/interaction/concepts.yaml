# Recognition vocabulary only. These identifiers describe claims a learner may
# make; they are not patient truth, evidence, rules, expected answers or scores.
reasoning_concept_ids:
  - acute_appendicitis
  - ectopic_pregnancy
  - ovarian_torsion
  - pelvic_inflammatory_disease
  - renal_colic
  - gastroenteritis
  - acute_prostatitis
  - prostatic_abscess
  # Postoperative volume-assessment hypotheses (second case). Recognition only.
  - hypovolaemia
  - volume_overload
  - postoperative_bleeding
  - sepsis
  - acute_kidney_injury

reasoning_concept_synonyms_ru:
  аппендицит: acute_appendicitis
  апендицит: acute_appendicitis
  острый аппендицит: acute_appendicitis
  внематочная беременность: ectopic_pregnancy
  перекрут яичника: ovarian_torsion
  воспалительное заболевание органов малого таза: pelvic_inflammatory_disease
  взомт: pelvic_inflammatory_disease
  почечная колика: renal_colic
  почечной коликой: renal_colic
  гастроэнтерит: gastroenteritis
  острый простатит: acute_prostatitis
  абсцесс простаты: prostatic_abscess
  # Normalised forms (ё written as е): the matcher compares normalised text.
  гиповолеми: hypovolaemia
  дефицит объема: hypovolaemia
  перегрузка объемом: volume_overload
  перегрузку объемом: volume_overload
  перегрузки объемом: volume_overload
  гиперволеми: volume_overload
  кровотечени: postoperative_bleeding
  сепсис: sepsis
  септическ: sepsis
  острое почечное повреждение: acute_kidney_injury
  острого почечного повреждения: acute_kidney_injury

# Investigations the platform RECOGNISES but has no approved modeled result for
# in the case set (case allowlist = `investigation_timing` keys; anything listed
# here that a case does model is simply supported there). Ordering one is a
# recognised SIMULATOR LIMITATION: reported as such, never as a learner error,
# and never answered with a guessed alternative study. Adding a modeled result is
# a separate clinical-review item; it needs no interpreter change.
recognized_unmodeled_tests:
  - id: pelvic_ultrasound
    label_ru: "УЗИ органов малого таза"

# Interventions the platform RECOGNISES but does not model in the case set.
# Naming one is reported as a SIMULATOR LIMITATION (not "unrecognised", not a
# learner error) and changes nothing in the patient. Matching is by normalised
# word stem at a word start. Modelling any of them is a clinical-review item.
recognized_unmodeled_interventions:
  - id: oxygen_therapy
    label_ru: "Кислородотерапия"
    stems_ru: ["кислород", "оксигенотерап", "оксигенац", "носовые канюли", "маска с резервуаром"]
  - id: vasopressor
    label_ru: "Вазопрессорная поддержка"
    stems_ru: ["вазопрессор", "норадреналин", "норэпинефрин", "дофамин", "допамин", "адреналин", "эпинефрин", "мезатон", "фенилэфрин"]
  - id: blood_transfusion
    label_ru: "Трансфузия компонентов крови"
    stems_ru: ["трансфуз", "переливани", "эритроцитарн", "свежезамороженн", "сзп"]

