classification:
  uncomplicated: "Воспаление червеобразного отростка без распространённого некроза/гангрены, перфорации, периаппендикулярного абсцесса или диффузного перитонита."
  complicated: "Острый аппендицит с распространённым некрозом/гангреной, перфорацией, периаппендикулярным абсцессом или диффузным перитонитом."
  appendicolith_note: "Аппендиколит повышает риск перфорации и неудачи неоперативного лечения, но сам по себе не определяет осложнённый аппендицит."
rec:
  WSES-R1: "Использовать шкалы стратификации риска для маршрутизации первичного обследования при боли в правой подвздошной области: у взрослых AIR или AAS, у детей PAS."
  WSES-R2: "Использовать клинико-лабораторные шкалы риска для выделения пациентов с низкой вероятностью аппендицита и решения вопроса о дальнейшей визуализации или наблюдении."
  WSES-R3.1: "Выбор визуализации у взрослого определяется клинической вероятностью диагноза, диагностическим вопросом, особенностями пациента и доступностью методов. УЗИ приемлемо как первая линия там, где КТ недоступна или приоритетом является снижение лучевой нагрузки. Если УЗИ неинформативно, а подозрение сохраняется, выполняется низкодозная КТ, если она доступна и подходит пациенту. Если КТ недоступна, дальнейшая тактика определяется риском и может включать активное наблюдение с повторной оценкой, перевод или операционное решение."
  WSES-R3.2: "У детей и подростков УЗИ является исследованием первой линии; низкодозная КТ применяется при неинформативном УЗИ или сохраняющемся высоком подозрении."
  WSES-R3.3: "У взрослых с ожирением (ИМТ ≥30) первично предпочтительна КТ, по возможности низкодозная, а не УЗИ."
  WSES-R3.4: "У пожилых пациентов первично предпочтительна КТ, по возможности низкодозная, а не УЗИ."
  WSES-R4: "У беременных при отрицательном или неопределённом УЗИ и сохраняющемся подозрении рекомендуется МРТ, если это не приводит к клинически значимой задержке диагностики или лечения."
  WSES-R5.1: "У тщательно отобранного стабильного взрослого с радиологически подтверждённым неосложнённым аппендицитом без аппендиколита антибиотики можно предложить как альтернативу аппендэктомии в рамках совместного принятия решения. Обязательны надёжное наблюдение, возможность быстрой повторной оценки и доступ к операции при неудаче, ухудшении или рецидиве. Пациенту сообщают, что первоначальный успех антибиотикотерапии не исключает рецидив и последующую аппендэктомию."
  WSES-R5.2: "У детей с неосложнённым аппендицитом антибиотики могут быть альтернативой аппендэктомии при адекватном мониторинге и совместном принятии решения."
  WSES-R5.3: "У беременных с неосложнённым аппендицитом предпочтительна лапароскопическая аппендэктомия. Неоперативное лечение может рассматриваться, если операция несёт повышенный риск или недоступна немедленно."
  WSES-R5.4: "У пожилых пациентов с неосложнённым аппендицитом предпочтительна аппендэктомия. Неоперативное лечение может рассматриваться при значимой коморбидности и высоком хирургическом риске."
  WSES-R6: "Амбулаторное лечение антибиотиками может рассматриваться при неосложнённом аппендиците, если обеспечены наблюдение и быстрый доступ к медицинской помощи при ухудшении."
  WSES-R7.1: "После неоперативного лечения неосложнённого аппендицита у взрослых не рекомендуется рутинное динамическое наблюдение дольше 30 дней; индивидуальный контроль возможен при сохраняющихся/рецидивирующих симптомах, диагностической неопределённости или факторах риска малигнизации."
  WSES-R7.2: "После неоперативного лечения неосложнённого аппендицита у детей не рекомендуется рутинное динамическое наблюдение дольше 30 дней; индивидуальный контроль возможен при сохраняющихся/рецидивирующих симптомах или диагностической неопределённости."
  WSES-R8: "У взрослых после неоперативного лечения неосложнённого аппендицита не следует рутинно выполнять интервальную аппендэктомию при отсутствии сохраняющихся или рецидивирующих симптомов."
  WSES-R9.1: "У взрослых с неосложнённым аппендицитом, выбранных для операции, лапароскопическую аппендэктомию следует выполнить в пределах 24 часов от поступления."
  WSES-R9.2: "У детей с неосложнённым аппендицитом, выбранных для операции, лапароскопическую аппендэктомию следует выполнить в пределах 24 часов от поступления."
  WSES-R10.1: "При осложнённом аппендиците свободную контаминированную жидкость необходимо эвакуировать. WSES предлагает аспирацию без рутинного лаважа вместо сочетания лаважа и аспирации; SAGES считает допустимыми обе стратегии с учётом интраоперационной ситуации и предпочтения хирурга. Рутинный лаваж не является обязательным."
  WSES-R10.2: "При лапароскопической аппендэктомии по поводу осложнённого аппендицита у детей предпочтительна аспирация загрязнённой жидкости без рутинного лаважа."
  WSES-R11.1: "У взрослых после лапароскопической аппендэктомии по поводу осложнённого аппендицита предлагается избегать рутинного профилактического дренирования брюшной полости; рекомендация условная, уверенность в доказательствах низкая. Правило относится к рутинной установке дренажа и не запрещает дренирование при конкретном установленном показании."
  WSES-R11.2: "Избегать рутинного дренирования брюшной полости у детей после лапароскопической аппендэктомии по поводу осложнённого аппендицита."
  WSES-R12: "При диагностической лапароскопии по поводу подозрения на аппендицит удаление макроскопически неизменённого отростка можно рассмотреть, если другая внутрибрюшная или тазовая патология, объясняющая клиническую картину, не обнаружена."
  WSES-R13.1: "При периаппендикулярном абсцессе у взрослых <35 лет предлагается ранняя лапароскопическая аппендэктомия; при недостатке лапароскопической экспертизы или ресурсов допустимо первичное неоперативное лечение с интервальной аппендэктомией через 6–12 недель. У пациентов ≥35 лет предлагается отказаться от ранней аппендэктомии из-за повышенного риска опухоли аппендикса."
  WSES-R13.2: "У детей с периаппендикулярным абсцессом предлагается ранняя лапароскопическая аппендэктомия; при недостатке лапароскопической экспертизы или ресурсов допустимо первичное неоперативное лечение с последующей интервальной аппендэктомией."
  WSES-R14.1: "У взрослых ≥35 лет после первичного неоперативного лечения периаппендикулярного абсцесса рекомендуется интервальная аппендэктомия через 6–12 недель для снижения риска пропущенной опухоли аппендикса."
  WSES-R14.2: "У детей после первичного неоперативного лечения периаппендикулярного абсцесса рутинная интервальная аппендэктомия не рекомендуется."
  WSES-R15.1: "У взрослых с неосложнённым аппендицитом перед лапароскопической аппендэктомией рекомендуется однократная доза профилактического антибиотика в периоперационное окно перед разрезом или индукцией в соответствии с локальным протоколом."
  WSES-R15.2: "У детей с неосложнённым аппендицитом перед лапароскопической аппендэктомией предлагается однократная доза профилактического антибиотика."
  WSES-R16.1: "У взрослого с осложнённым аппендицитом лечебную антибактериальную терапию начинают до операции, особенно если немедленное вмешательство невозможно. Выбранная лечебная схема должна обеспечивать необходимое периоперационное покрытие в соответствии с локальным протоколом. Профилактическая и лечебная цели различаются, но это не означает автоматическое назначение двух параллельных курсов или дублирование препаратов."
  WSES-R16.2: "У детей с осложнённым аппендицитом перед лапароскопической аппендэктомией рекомендуется профилактический антибиотик и терапевтические антибиотики в ожидании операции, особенно если немедленная операция невозможна."
  WSES-R17.1: "После лапароскопической аппендэктомии по поводу подтверждённого неосложнённого аппендицита WSES предлагает не назначать послеоперационные антибиотики рутинно; рекомендация условная, уверенность в доказательствах низкая. Если получены данные за осложнённую инфекцию, пациент переводится в осложнённый путь и это правило к нему больше не применяется."
  WSES-R17.2: "У детей после лапароскопической аппендэктомии по поводу неосложнённого аппендицита рекомендация по послеоперационным антибиотикам не сформулирована из-за очень низкой уверенности доказательств."
  WSES-R18.1: "У взрослых после лапароскопической аппендэктомии по поводу осложнённого аппендицита рекомендуются послеоперационные антибиотики."
  WSES-R18.2: "У детей после лапароскопической аппендэктомии по поводу осложнённого аппендицита предлагаются послеоперационные антибиотики."
  WSES-R19.1: "У взрослых с осложнённым аппендицитом после адекватного контроля источника предлагается короткий послеоперационный курс антибиотиков 2–3 дня вместо 5–7 дней."
  WSES-R19.2: "У детей с осложнённым аппендицитом после адекватного контроля источника предлагается короткий послеоперационный курс антибиотиков 2–3 дня вместо 5–7 дней."
kzdelta:
  KZDELTA-1: "КП РК использует шкалу Альварадо с числовыми порогами; WSES 2025 рекомендует AIR, AAS и PAS."
  KZDELTA-2: "КП РК допускает 12/24-часовое наблюдение при среднем риске и рекомендует эмпирическую антибактериальную терапию. WSES 2025 формулирует антибиотикотерапию иначе. Это требует отдельной проверки сопоставимости контекстов перед тем, как считать позиции прямым противоречием."
  KZDELTA-3: "КП РК не предлагает неоперативное лечение как стандартную альтернативу при неосложнённом аппендиците; антибиотики указаны при отказе пациента от операции. WSES 2025 допускает антибиотики как альтернативу при мониторинге и совместном принятии решения."
  KZDELTA-4: "КП РК указывает, что лапароскопию не следует рассматривать как первый выбор у беременных; WSES 2025 предпочитает лапароскопическую аппендэктомию при неосложнённом аппендиците у беременных."
  KZDELTA-5: "КП РК рекомендует 3–5 дней послеоперационной антибиотикотерапии при осложнённом аппендиците у взрослых; WSES 2025 предлагает 2–3 дня после адекватного контроля источника."
  KZDELTA-6: "КП РК не использует порог 35 лет для интервальной аппендэктомии после абсцесса; WSES 2025 рекомендует интервальную аппендэктомию через 6–12 недель у взрослых ≥35 лет после первичного неоперативного лечения абсцесса."
  KZDELTA-7: "КП РК формулирует острый аппендицит как показание к экстренной операции; WSES 2025 для неосложнённого аппендицита, выбранного для хирургии, допускает выполнение операции в пределах 24 часов от поступления."
  KZDELTA-8: "КП РК называет конкретные антибактериальные препараты и дозы; WSES 2025 не задаёт конкретную молекулу в рекомендациях."
trap:
  TRAP-US-NEGATIVE: "Отрицательное или неинформативное УЗИ ошибочно трактуется как исключение аппендицита при сохраняющемся клиническом подозрении."
  TRAP-SCORE-DIAGNOSIS: "Шкала риска используется как окончательный диагноз, а не как инструмент стратификации и выбора следующего шага."
  TRAP-POSTOP-ABX-UNCOMPLICATED: "Назначение рутинных послеоперационных антибиотиков взрослому после операции по поводу неосложнённого аппендицита."
  TRAP-LONG-ABX-COMPLICATED: "Автоматическое назначение 5–7 дней антибиотиков после адекватного контроля источника при осложнённом аппендиците."
  TRAP-ROUTINE-DRAIN: "Рутинное дренирование после лапароскопической аппендэктомии по поводу осложнённого аппендицита."
  TRAP-LAVAGE: "Рутинный лаваж подаётся как обязательный шаг или, наоборот, как запрещённый: WSES предпочитает аспирацию без рутинного лаважа, SAGES допускает обе стратегии. Обсуждается адекватность контроля источника, а не бинарный выбор."
  TRAP-DELAY-OVER-24H: "Отсрочка операции более 24 часов у пациента с неосложнённым аппендицитом, выбранного для хирургического лечения."
  TRAP-NORMAL-APPENDIX-LEAVE: "Оставление макроскопически неизменённого аппендикса при диагностической лапароскопии, если другой причины симптомов не найдено."
  TRAP-NOM-NO-MONITORING: "Неоперативное лечение предлагается без возможности адекватного мониторинга и быстрой эскалации помощи при неудаче."
  TRAP-ABSCESS-AGE35-EARLY-SURGERY: "Ранняя аппендэктомия подаётся как стандартный выбор при периаппендикулярном абсцессе у пациента ≥35 лет."
  TRAP-ABSCESS-AGE35-NO-INTERVAL: "После первичного неоперативного лечения периаппендикулярного абсцесса у пациента ≥35 лет не запланирована интервальная аппендэктомия через 6–12 недель."
op:
  OP-TRANSFER-1: "Когда при абдоминальном сепсисе допустим перевод до контроля источника, а когда контроль источника должен быть выполнен на месте: правило зависит от стабильности пациента, доступных возможностей и времени транспортировки. Нужна отдельная экспертная валидация."
  OP-PREG-TRANSFER: "Правило перевода беременной между уровнями стационара требует отдельной валидации с учётом срока беременности, стабильности, акушерской и хирургической доступности и времени эвакуации."
  OP-BASIC-DIAGNOSTIC-UNCERTAINTY: "На basic-уровне при диагностической неопределённости нельзя автоматически кодировать единственно правильный ответ «оперировать». Нужна экспертно утверждённая развилка наблюдение / операция / перевод с учётом клиники и ресурса."
