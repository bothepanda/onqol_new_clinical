schema_version: '0.1'
disease_id: app-acute
purpose: Semantic routing only. This dictionary helps map free-text clinical language to language-neutral concept_ids. It
  must not contain patient-specific findings, scoring, or medical correctness rules.
supported_locales:
- ru
- kk
- en
translation_status:
  ru: internal_review
  kk: draft_clinical_translation_needs_kazakh_surgeon_review
  en: internal_review
router_rules:
  concept_ids_are_language_neutral: true
  multiple_concepts_per_utterance: true
  broad_requests_may_expand_to_children: true
  do_not_invent_patient_findings: true
  do_not_score_from_dictionary: true
  unknown_or_noncase_terms_must_not_be_forced_to_nearest_concept: true
  partial_parse_executes_recognized_items: true
  mixed_language_input_allowed: true
