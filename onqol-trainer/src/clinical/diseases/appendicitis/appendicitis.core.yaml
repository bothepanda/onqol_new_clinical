coding:
  system: ICD-10
  category: K35
  subcodes_status: needs_local_coding_review
  note: "Keep the K35 category as canonical for MVP. Current Kazakhstan documents include K35.2, K35.3 and K35.8. The exact coding system/version and the subcodes used by pilot institutions require formal local coding review; until then the MVP stores category K35 only. The earlier claim that the 2018/2019 protocol lists K35.0/K35.1/K35.9 was not reliable and is withdrawn."

