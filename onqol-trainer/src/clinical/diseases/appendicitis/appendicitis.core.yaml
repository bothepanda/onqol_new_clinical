source_classes:
  guideline: "Direct recommendation from an external guideline"
  local_protocol: "Requirement or recommendation from Kazakhstan clinical protocol"
  operationalized: "ON QOL operational rule derived from evidence/resource constraints; requires explicit clinical review"

classification:
  uncomplicated:
    rule_id: class_uncomplicated
    definition_key: classification.uncomplicated
    machine_definition:
      requires_appendiceal_inflammation: true
      excludes:
        - extended_gangrene_or_necrosis
        - perforation
        - periappendicular_abscess
        - diffuse_peritonitis
    source_ids: [WSES2025]
  complicated:
    rule_id: class_complicated
    definition_key: classification.complicated
    any_of:
      - extended_gangrene_or_necrosis
      - perforation
      - periappendicular_abscess
      - diffuse_peritonitis
    source_ids: [WSES2025]
  appendicolith:
    rule_id: class_appendicolith
    is_complicated_by_definition: false
    note_key: classification.appendicolith_note
    source_ids: [WSES2025]

