scoring_semantics:
  strong_recommendation:
    default_weight: high
    justified_deviation_possible: true
    requires_reason_if_deviating: true
  conditional_recommendation:
    default_weight: medium
    justified_deviation_possible: true
    do_not_encode_as_absolute_ban: true
  no_recommendation:
    default_weight: none
    score_only_if_case_has_separately_reviewed_local_rule: true

case_generator_constraints:
  - id: GEN-1
    rule: "Clinical correctness must come from structured recommendations, not model judgment."
  - id: GEN-2
    rule: "Never invent numeric AIR/AAS/PAS cutoffs until primary score sources are added."
  - id: GEN-3
    rule: "Never invent a specific antibiotic molecule/dose from WSES2025. If local-protocol antibiotics are exposed, label provenance as KZ_AA_2018 and keep local formulary review separate."
  - id: GEN-4
    rule: "A conditional recommendation must not be converted into an absolute prohibition in scoring or feedback."
  - id: GEN-5
    rule: "Do not state that NOM is prohibited in all complicated appendicitis. Periappendicular abscess has a guideline-supported nonoperative branch in selected settings."
  - id: GEN-6
    rule: "If WSES and Kazakhstan protocol differ, feedback must disclose both positions and the delta type."
  - id: GEN-7
    rule: "A case may only reveal tests available at the selected resource level."

