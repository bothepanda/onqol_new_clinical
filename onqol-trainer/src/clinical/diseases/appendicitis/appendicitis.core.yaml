numeric_facts:
  appendiceal_neoplasm_risk_with_periappendicular_abscess_age_gte_35:
    value_up_to_percent: 14.3
    source_ids: [WSES2025]
  nom_recurrence_uncomplicated:
    value_percent_range: null
    source_ids: []
    verification_status: withdrawn_2026_08_19_unqualified_range_not_supported
    withdrawal_note: "The previously stored recurrence range was carried from an internal card and never verified against a source line. It is not learner-visible and not reviewer-facing. Reviewer documentation may cite APPAC (Salminen 2018, JAMA, DOI 10.1001/jama.2018.13201) recurrence of 27.3% at 1 year and 39.1% at 5 years, always with the time horizon and the study population stated. No recurrence percentage reaches a learner until a rule carrying it completes the approval workflow."
  surgery_window_uncomplicated_selected_for_surgery:
    max_hours_from_admission: 24
    source_ids: [WSES2025]
  interval_appendectomy_after_abscess_age_gte_35:
    weeks: [6, 12]
    source_ids: [WSES2025]
  postop_antibiotics_complicated_after_adequate_source_control:
    days: [2, 3]
    source_ids: [WSES2025]

risk_scores:
  # The guideline names all three. What the PRODUCT may name is split by
  # population: PAS is a paediatric score and the current vertical slice is
  # adult, so the adult runtime never suggests it.
  allowed_names: [AIR, AAS, PAS]
  adult_allowed_names: [AIR, AAS]
  pediatric_only_names: [PAS]
  numeric_cutoffs_available_in_corpus: false
  generator_rule: "May name the score and qualitative stratum. Must not invent numeric cutoffs until primary score-validation sources are added."

resource_context:
  levels: [basic, limited, enhanced, maximal]
  diagnosis_routes:
    basic:
      available: [clinical_assessment, basic_laboratory_tests]
      ct_available: false
      ultrasound: variable
      preferred_logic: risk_stratification_and_active_observation_when_appropriate
      source_basis: [WSES-R1, WSES-R2]
    limited:
      available: [clinical_assessment, basic_laboratory_tests, ultrasound]
      ct_available: false
      preferred_logic: risk_stratification_plus_ultrasound
      source_basis: [WSES-R3.1]
    enhanced:
      available: [clinical_assessment, laboratory_tests, ultrasound, low_dose_ct]
      ct_available: true
      preferred_logic: low_dose_ct_when_indicated
      source_basis: [WSES-R3.1]
    maximal:
      available: [clinical_assessment, laboratory_tests, ultrasound, low_dose_ct, mri]
      ct_available: true
      mri_available: true
      source_basis: [WSES-R3.1, WSES-R4]
  note: "Resource definitions are ON QOL infrastructure categories. Clinical actions within them must retain provenance: guideline/local_protocol/operationalized."

