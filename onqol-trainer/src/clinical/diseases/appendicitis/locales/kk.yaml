  complicated: "Жайылған некроз/гангрена, перфорация, периаппендикулярлық абсцесс немесе жайылмалы перитонитпен жүретін жіті аппендицит."
  appendicolith_note: "Аппендиколит перфорация және консервативтік ем сәтсіздігінің қаупін арттырады, бірақ өзі ғана асқынған аппендициттің анықтаушы белгісі емес."
rec:
  WSES-R1: "Оң жақ мықын аймағындағы ауырсыну кезінде бастапқы тексеруді бағыттау үшін қауіп стратификациясы шкалаларын қолдану: ересектерде AIR немесе AAS, балаларда PAS."
  WSES-R2: "Аппендицит ықтималдығы төмен науқастарды анықтау және әрі қарай визуализация немесе бақылау қажеттігін шешу үшін клиникалық-зертханалық қауіп шкалаларын қолдану."
  WSES-R3.1: "Ересекте визуализация әдісін таңдау диагноздың клиникалық ықтималдығына, диагностикалық сұраққа, науқастың ерекшеліктеріне және әдістердің қолжетімділігіне байланысты. КТ қолжетімсіз болса немесе сәулелену жүктемесін азайту басым болса, УДЗ бірінші кезең ретінде қолайлы. УДЗ ақпаратсыз болып, күдік сақталса, қолжетімді әрі науқасқа қолайлы болған жағдайда төмен дозалы КТ орындалады. КТ қолжетімсіз болса, әрі қарайғы тактика қауіп деңгейімен айқындалады және қайта бағалаумен белсенді бақылауды, ауыстыруды немесе операциялық шешімді қамтуы мүмкін."
  WSES-R3.2: "Балалар мен жасөспірімдерде УДЗ бірінші қатардағы зерттеу; УДЗ ақпаратсыз болса немесе жоғары күдік сақталса, төмен дозалы КТ қолданылады."
  WSES-R3.3: "Семіздігі бар ересектерде (ДМИ ≥30) бастапқы визуализация ретінде УДЗ-дан гөрі КТ, мүмкіндігінше төмен дозалы КТ, артықшылықты."
  WSES-R3.4: "Егде жастағы науқастарда бастапқы визуализация ретінде УДЗ-дан гөрі КТ, мүмкіндігінше төмен дозалы КТ, артықшылықты."
  WSES-R4: "Жүкті әйелдерде бастапқы УДЗ теріс немесе анықсыз болып, клиникалық күдік сақталса, диагностика немесе емді клиникалық маңызды кешіктірмейтін жағдайда МРТ ұсынылады."
  WSES-R5.1: "Мұқият іріктелген, тұрақты жағдайдағы, аппендиколиті жоқ, радиологиялық расталған асқынбаған аппендициті бар ересекте антибиотиктерді бірлесіп шешім қабылдау аясында аппендэктомияға балама ретінде ұсынуға болады. Сенімді бақылау, жылдам қайта бағалау мүмкіндігі және сәтсіздік, нашарлау немесе рецидив кезінде операцияға қолжетімділік міндетті. Науқасқа антибиотикотерапияның бастапқы сәттілігі рецидив пен кейінгі аппендэктомияны жоққа шығармайтыны хабарланады."
  WSES-R5.2: "Асқынбаған аппендициті бар балаларда тиісті клиникалық бақылау және отбасы/науқаспен бірлесіп шешім қабылдау болған жағдайда антибиотиктер аппендэктомияға балама болуы мүмкін."
  WSES-R5.3: "Асқынбаған аппендициті бар жүкті әйелдерде лапароскопиялық аппендэктомия артықшылықты. Операция қаупі жоғары болса немесе ол дереу қолжетімсіз болса, консервативтік ем қарастырылуы мүмкін."
  WSES-R5.4: "Асқынбаған аппендициті бар егде жастағы науқастарда аппендэктомия артықшылықты. Айқын қосалқы аурулар және жоғары хирургиялық қауіп кезінде консервативтік ем қарастырылуы мүмкін."
  WSES-R6: "Асқынбаған аппендицитті антибиотиктермен амбулаториялық емдеу дұрыс бақылау және жағдай нашарласа медициналық көмекке жылдам қолжетімділік болғанда қарастырылуы мүмкін."
  WSES-R7.1: "Ересектерде асқынбаған аппендицитті консервативтік емдегеннен кейін 30 күннен ұзақ рутиндік бақылау ұсынылмайды; симптомдар сақталса/қайталанса, диагноз анық болмаса немесе қатерлі ісік қаупі болса жеке бақылау қарастырылуы мүмкін."
  WSES-R7.2: "Балаларда асқынбаған аппендицитті консервативтік емдегеннен кейін 30 күннен ұзақ рутиндік бақылау ұсынылмайды; симптомдар сақталса/қайталанса немесе диагноз анық болмаса жеке бақылау қарастырылуы мүмкін."
  WSES-R8: "Ересектерде асқынбаған аппендицитті консервативтік емдегеннен кейін симптомдар сақталмаса немесе қайталанбаса, рутиндік интервалды аппендэктомия жасалмайды."
  WSES-R9.1: "Операциялық ем таңдалған асқынбаған аппендициті бар ересектерде лапароскопиялық аппендэктомия ауруханаға түскеннен кейін 24 сағат ішінде орындалуы тиіс."
  WSES-R9.2: "Операциялық ем таңдалған асқынбаған аппендициті бар балаларда лапароскопиялық аппендэктомия ауруханаға түскеннен кейін 24 сағат ішінде орындалуы тиіс."
  WSES-R10.1: "Асқынған аппендицитте бос ластанған сұйықтықты эвакуациялау қажет. WSES шаю мен аспирацияны қоса қолданудың орнына рутиндік шаюсыз аспирацияны ұсынады; SAGES интраоперациялық жағдай мен хирургтің таңдауын ескере отырып екі стратегияны да қолайлы санайды. Рутиндік шаю міндетті емес."
  WSES-R10.2: "Балаларда асқынған аппендицитке байланысты лапароскопиялық аппендэктомия кезінде құрсақ қуысын рутиндік шаюдың орнына ластанған сұйықтықты аспирациялау ұсынылады."
  WSES-R11.1: "Ересектерде асқынған аппендицитке байланысты лапароскопиялық аппендэктомиядан кейін құрсақ қуысын рутиндік профилактикалық дренаждаудан аулақ болу ұсынылады; ұсыным шартты, дәлелдер сенімділігі төмен. Ереже дренажды рутиндік қоюға қатысты және нақты айқындалған көрсетілім болғанда дренаждауға тыйым салмайды."
  WSES-R11.2: "Балаларда асқынған аппендицитке байланысты лапароскопиялық аппендэктомиядан кейін құрсақ қуысын рутиндік дренаждаудан аулақ болу ұсынылады."
  WSES-R12: "Аппендицитке күдікпен жасалған диагностикалық лапароскопия кезінде клиникалық көріністі түсіндіретін басқа құрсақішілік немесе жамбас патологиясы табылмаса, макроскопиялық өзгермеген құрттәрізді өсіндіні алып тастауды қарастыруға болады."
  WSES-R13.1: "Периаппендикулярлық абсцесі бар <35 жастағы ересектерде ерте лапароскопиялық аппендэктомия ұсынылады; жеткілікті лапароскопиялық тәжірибе немесе шұғыл операция ресурсы жоқ болса, бастапқы консервативтік ем және 6–12 аптадан кейін интервалды аппендэктомия балама болуы мүмкін. ≥35 жаста ерте аппендэктомия өсінді ісігінің жоғары қаупіне байланысты ұсынылмайды."
  WSES-R13.2: "Периаппендикулярлық абсцесі бар балаларда ерте лапароскопиялық аппендэктомия ұсынылады; жеткілікті лапароскопиялық тәжірибе немесе шұғыл операция ресурсы жоқ жағдайда бастапқы консервативтік ем және кейінгі интервалды аппендэктомия балама болуы мүмкін."
  WSES-R14.1: "≥35 жастағы ересектерде периаппендикулярлық абсцесті бастапқы консервативтік емдегеннен кейін өсінді ісігін өткізіп алу қаупін азайту үшін 6–12 аптадан кейін интервалды аппендэктомия ұсынылады."
  WSES-R14.2: "Балаларда периаппендикулярлық абсцесті бастапқы консервативтік емдегеннен кейін рутиндік интервалды аппендэктомия ұсынылмайды."
  WSES-R15.1: "Асқынбаған аппендициті бар ересектерде лапароскопиялық аппендэктомия алдында профилактикалық антибиотиктің бір реттік дозасы жергілікті хаттамаға сәйкес тілік немесе индукция алдындағы периоперациялық терезеде ұсынылады."
  WSES-R15.2: "Асқынбаған аппендициті бар балаларда лапароскопиялық аппендэктомия алдында профилактикалық антибиотиктің бір реттік дозасы ұсынылады."
  WSES-R16.1: "Асқынған аппендициті бар ересекте емдік антибактериялық терапия операцияға дейін басталады, әсіресе дереу араласу мүмкін болмағанда. Таңдалған емдік схема жергілікті хаттамаға сәйкес қажетті периоперациялық қорғанысты қамтамасыз етуге тиіс. Профилактикалық және емдік мақсаттар әртүрлі, бірақ бұл екі қатар курсты немесе препараттарды қайталауды автоматты түрде тағайындауды білдірмейді."
  WSES-R16.2: "Асқынған аппендициті бар балаларда лапароскопиялық аппендэктомия алдында профилактикалық антибиотик және, әсіресе операцияны дереу жасау мүмкін болмаса, операцияны күту кезінде емдік антибиотиктер ұсынылады."
  WSES-R17.1: "Расталған асқынбаған аппендицитке байланысты лапароскопиялық аппендэктомиядан кейін WSES операциядан кейінгі антибиотиктерді рутиндік түрде тағайындамауды ұсынады; ұсыным шартты, дәлелдер сенімділігі төмен. Асқынған инфекция деректері алынса, науқас асқынған жолға ауыстырылады және бұл ереже оған қолданылмайды."
  WSES-R17.2: "Балаларда асқынбаған аппендицитке байланысты лапароскопиялық аппендэктомиядан кейін операциядан кейінгі антибиотиктер жөнінде дәлелдемелер сенімділігі өте төмен болғандықтан ұсыныс тұжырымдалмаған."
  WSES-R18.1: "Ересектерде асқынған аппендицитке байланысты лапароскопиялық аппендэктомиядан кейін операциядан кейінгі антибиотиктер ұсынылады."
  WSES-R18.2: "Балаларда асқынған аппендицитке байланысты лапароскопиялық аппендэктомиядан кейін операциядан кейінгі антибиотиктер ұсынылады."
  WSES-R19.1: "Ересектерде асқынған аппендицит және инфекция ошағын адекватты санациялаудан кейін 5–7 күннің орнына 2–3 күндік қысқа операциядан кейінгі антибиотик курсы ұсынылады."
  WSES-R19.2: "Балаларда асқынған аппендицит және инфекция ошағын адекватты санациялаудан кейін 5–7 күннің орнына 2–3 күндік қысқа операциядан кейінгі антибиотик курсы ұсынылады."
kzdelta:
  KZDELTA-1: "ҚР клиникалық хаттамасы Альварадо шкаласын сандық шектермен қолданады; WSES 2025 AIR, AAS және PAS шкалаларын ұсынады."
  KZDELTA-2: "ҚР хаттамасы орташа қауіп кезінде 12/24 сағаттық бақылауға және эмпирикалық антибиотиктік емге жол береді. WSES 2025 антибиотиктерді басқа контексте тұжырымдайды. Мұны тікелей қайшылық деп бағаламас бұрын контексттердің сәйкестігін бөлек тексеру қажет."
  KZDELTA-3: "ҚР хаттамасында асқынбаған аппендицитте консервативтік ем стандартты балама ретінде қарастырылмайды; антибиотиктер операциядан бас тартқан кезде көрсетілген. WSES 2025 мониторинг және бірлескен шешім жағдайында антибиотиктерді балама ретінде қарастырады."
  KZDELTA-4: "ҚР хаттамасы жүкті әйелдерде лапароскопияны бірінші таңдау ретінде қарастырмауды айтады; WSES 2025 жүкті әйелдердегі асқынбаған аппендицитте лапароскопиялық аппендэктомияны артықшылықты деп санайды."
  KZDELTA-5: "ҚР хаттамасы ересектердегі асқынған аппендициттен кейін 3–5 күн антибиотик ұсынады; WSES 2025 инфекция ошағын адекватты бақылаудан кейін 2–3 күн ұсынады."
  KZDELTA-6: "ҚР хаттамасында абсцестен кейінгі интервалды аппендэктомия үшін 35 жас шегі жоқ; WSES 2025 ≥35 жастағы ересектерге бастапқы консервативтік емнен кейін 6–12 аптада интервалды аппендэктомия ұсынады."
  KZDELTA-7: "ҚР хаттамасы жіті аппендицитті шұғыл операцияға көрсеткіш деп тұжырымдайды; WSES 2025 операциялық ем таңдалған асқынбаған аппендицитте операцияны түскеннен кейін 24 сағат ішінде орындауға мүмкіндік береді."
  KZDELTA-8: "ҚР хаттамасы нақты антибиотиктер мен дозаларды атайды; WSES 2025 ұсыныстарында нақты молекула көрсетілмейді."
trap:
  TRAP-US-NEGATIVE: "Клиникалық күдік сақталған кезде теріс немесе ақпаратсыз УДЗ аппендицитті толық жоққа шығарады деп қате қабылдау."
  TRAP-SCORE-DIAGNOSIS: "Қауіп шкаласын стратификация және келесі қадамды таңдау құралы емес, түпкілікті диагноз ретінде қолдану."
  TRAP-POSTOP-ABX-UNCOMPLICATED: "Асқынбаған аппендицит бойынша операциядан кейін ересек науқасқа рутиндік операциядан кейінгі антибиотик тағайындау."
  TRAP-LONG-ABX-COMPLICATED: "Инфекция ошағын адекватты бақылаудан кейін асқынған аппендицитте автоматты түрде 5–7 күн антибиотик тағайындау."
  TRAP-ROUTINE-DRAIN: "Асқынған аппендицитке байланысты лапароскопиялық аппендэктомиядан кейін рутиндік дренаждау."
  TRAP-LAVAGE: "Рутиндік шаю міндетті қадам ретінде немесе, керісінше, тыйым салынған әрекет ретінде ұсынылады: WSES рутиндік шаюсыз аспирацияны артық көреді, SAGES екі стратегияны да қолайлы санайды. Бинарлық таңдау емес, көз бақылауының жеткіліктілігі талқыланады."
  TRAP-DELAY-OVER-24H: "Операциялық ем таңдалған асқынбаған аппендицитте операцияны 24 сағаттан артық кешіктіру."
  TRAP-NORMAL-APPENDIX-LEAVE: "Басқа себеп табылмаған диагностикалық лапароскопия кезінде макроскопиялық өзгермеген құрттәрізді өсіндіні қалдыру."
  TRAP-NOM-NO-MONITORING: "Консервативтік ем жеткілікті мониторингсіз және сәтсіздік кезінде жедел эскалация мүмкіндігінсіз ұсынылады."
  TRAP-ABSCESS-AGE35-EARLY-SURGERY: "≥35 жастағы периаппендикулярлық абсцесі бар науқаста ерте аппендэктомия стандартты таңдау ретінде ұсынылады."
  TRAP-ABSCESS-AGE35-NO-INTERVAL: "≥35 жастағы науқаста периаппендикулярлық абсцесті бастапқы консервативтік емдегеннен кейін 6–12 аптада интервалды аппендэктомия жоспарланбаған."
op:
  OP-TRANSFER-1: "Құрсақ сепсисінде инфекция ошағын бақылауға дейін немесе кейін ауыстыру туралы шешім науқастың тұрақтылығына, жергілікті мүмкіндіктерге және тасымалдау уақытына тәуелді. Бұл ереже жеке эксперттік валидацияны қажет етеді."
  OP-PREG-TRANSFER: "Жүкті науқасты стационар деңгейлері арасында ауыстыру ережесі жүктілік мерзімін, тұрақтылықты, акушерлік және хирургиялық мүмкіндіктерді және эвакуация уақытын ескеріп жеке валидацияны қажет етеді."
  OP-BASIC-DIAGNOSTIC-UNCERTAINTY: "Basic деңгейінде диагноз анық болмаған кезде жалғыз дұрыс жауап ретінде автоматты түрде «операция» деп кодтауға болмайды. Бақылау / операция / ауыстыру тармақтары клиника мен ресурсқа қарай эксперттік түрде бекітілуі тиіс."
translation_review_notes:
  - "Терминдер 2026 жылғы ішкі глоссариймен үйлестірілді, бірақ қазақ тілінде жұмыс істейтін хирургтың тұтас клиникалық редакциясы қажет."
  - "'Инфекция ошағын адекватты бақылау/санациялау', 'қауіп стратификациясы', 'интервалды аппендэктомия' сияқты терминдерді рецензентпен біріздендіру қажет."
