corpus_id: onqol-base-layer-v1
version: '0.1.0'
layer: base
provenance_tier: B

purpose:
  - teaching-level knowledge the guidelines assume but do not state
  - semiotics, physical examination technique, history-taking structure
  - grounding for mentor replies where no guideline recommendation exists

not_for:
  - being the scored correct answer (same rule as T3, see PRD)
  - overriding a guideline recommendation (T1/T2)
  - creating patient facts
  - replacing the Kazakhstan protocol overlay

authority_order:
  - validated_case_card
  - validated_disease_card
  - current_disease_specific_guideline
  - kazakhstan_protocol_overlay
  - base_layer          # lowest: teaches, never decides

# ---------------------------------------------------------------------------
# LICENSING - read before adding anything here
#
# StatPearls is CC BY-NC-ND 4.0. Two clauses bite:
#
#   NC (NonCommercial). Fine for a free educational pilot. NOT fine once ON QOL
#   charges for a subscription. Every fact anchored here must therefore stay
#   re-anchorable: the fact lives in our own words with a source id, so the id
#   can be repointed at an open or self-authored source without touching the
#   trainer.
#
#   ND (NoDerivatives). Permits distributing the unaltered article. Does not
#   permit distributing a transformed version. Practical rule: state the fact
#   and cite, or quote briefly with attribution. Do not ship paraphrased
#   article text as if it were ours.
#
# Consequence: these files are NOT ingested as full text. They are the source
# a human author checks against, and the citation the learner can open.
# ---------------------------------------------------------------------------

license_review:
  status: PILOT_ONLY
  blocker_for_monetisation: true
  note: >-
    NC clause conflicts with the B2C subscription in the PRD revenue model.
    Raise with the healthcare lawyer already scheduled post-pilot, together
    with the КП! teaching points.

local_path: ~/Desktop/statpearls
ingest_policy: citation_only

sources:
  - id: statpearls_appendicitis
    title: Appendicitis
    publisher: StatPearls Publishing
    bookshelf_id: NBK493193
    pmid: 29630245
    last_update: 2024-02-12
    license: CC BY-NC-ND 4.0
    ingest_fulltext: false
    role: base_semiotics_and_natural_history
    covers:
      - pain migration and its visceral/parietal mechanism
      - McBurney point, guarding, rebound
      - Rovsing, psoas, Dunphy signs and their non-diagnostic status
      - symptom timeline and perforation risk over time
    topics: [appendicitis, abdominal_examination, semiotics]

